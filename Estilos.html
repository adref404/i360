<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#141A2B; --ink-2:#465068; --muted:#6F788C;
  --line:#DCE1E9; --line-2:#C9D0DB; --accent:#1E3A8A; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --c-vin:#2a78d6; --c-aud:#eb6834; --c-iet:#1baf7a; --c-res:#eda100; --c-vha:#e87ba4; --c-ges:#008300; --c-vac:#4a3aa7; --c-dm:#e34948;
  --c-lic:#9a8f80; --c-fer:#c9cdd6; --c-cum:#f6d3df; --c-do:#FFFFFF;
  --i-vin:#fff; --i-aud:#fff; --i-iet:#062b1d; --i-res:#2b1d00; --i-vha:#3b0d20; --i-ges:#fff; --i-vac:#fff; --i-dm:#fff; --i-lic:#fff;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --div-lo2:#6da7ec; --div-lo1:#b7d3f6; --div-mid:#f0efec; --div-hi1:#f3b9b8; --div-hi2:#e36a69;
  --good:#1C7C4A; --good-soft:#DDF1E5; --warn:#A5610B; --warn-soft:#FBEBD2; --crit:#B4233F; --crit-soft:#F9DDE3; --info-soft:#E6ECF7; --info:#2F4B8A;
  --viatico:#E5B021; --shadow:0 1px 2px rgba(20,26,43,.06),0 4px 16px rgba(20,26,43,.06);
  --sem1:#1a9850; --sem2:#91cf60; --sem3:#fee08b; --sem4:#fc8d59; --sem5:#d73027;
  --semi1:#ffffff; --semi2:#0f2a0f; --semi3:#3a2c00; --semi4:#2a0f00; --semi5:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F131C; --surface:#171C28; --surface-2:#1D2331; --ink:#E8ECF4; --ink-2:#B5BDCD; --muted:#8C95A8;
    --line:#2A3142; --line-2:#394155; --accent:#8FA8F0; --accent-ink:#0F131C; --accent-soft:#232C45;
    --c-vin:#3987e5; --c-aud:#d95926; --c-iet:#199e70; --c-res:#c98500; --c-vha:#d55181; --c-ges:#008300; --c-vac:#9085e9; --c-dm:#e66767;
    --c-lic:#6f675d; --c-fer:#3d4354; --c-cum:#5a3444; --c-do:#1D2331;
    --i-vin:#fff; --i-aud:#fff; --i-iet:#fff; --i-res:#1a1100; --i-vha:#fff; --i-ges:#fff; --i-vac:#10093a; --i-dm:#fff; --i-lic:#fff;
    --seq-1:#1b2b45; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#b7d3f6;
    --div-lo2:#256abf; --div-lo1:#1c3b66; --div-mid:#383835; --div-hi1:#6b2a2a; --div-hi2:#c24848;
    --good:#5BC98C; --good-soft:#173527; --warn:#E3A64B; --warn-soft:#3A2A12; --crit:#F07A93; --crit-soft:#3D1A23; --info-soft:#1E2940; --info:#9DB4EE;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --sem1:#1f8a4c; --sem2:#6fae45; --sem3:#c9a93a; --sem4:#d9713f; --sem5:#c8352c;
    --semi1:#ffffff; --semi2:#0f1f08; --semi3:#1d1600; --semi4:#1d0a00; --semi5:#ffffff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131C; --surface:#171C28; --surface-2:#1D2331; --ink:#E8ECF4; --ink-2:#B5BDCD; --muted:#8C95A8;
  --line:#2A3142; --line-2:#394155; --accent:#8FA8F0; --accent-ink:#0F131C; --accent-soft:#232C45;
  --c-vin:#3987e5; --c-aud:#d95926; --c-iet:#199e70; --c-res:#c98500; --c-vha:#d55181; --c-ges:#008300; --c-vac:#9085e9; --c-dm:#e66767;
  --c-lic:#6f675d; --c-fer:#3d4354; --c-cum:#5a3444; --c-do:#1D2331;
  --i-vin:#fff; --i-aud:#fff; --i-iet:#fff; --i-res:#1a1100; --i-vha:#fff; --i-ges:#fff; --i-vac:#10093a; --i-dm:#fff; --i-lic:#fff;
  --seq-1:#1b2b45; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#b7d3f6;
  --div-lo2:#256abf; --div-lo1:#1c3b66; --div-mid:#383835; --div-hi1:#6b2a2a; --div-hi2:#c24848;
  --good:#5BC98C; --good-soft:#173527; --warn:#E3A64B; --warn-soft:#3A2A12; --crit:#F07A93; --crit-soft:#3D1A23; --info-soft:#1E2940; --info:#9DB4EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --sem1:#1f8a4c; --sem2:#6fae45; --sem3:#c9a93a; --sem4:#d9713f; --sem5:#c8352c;
  --semi1:#ffffff; --semi2:#0f1f08; --semi3:#1d1600; --semi4:#1d0a00; --semi5:#ffffff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
[data-drill]{cursor:pointer}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:18px;height:18px}
.brand b{font:700 19px/1 var(--f-display);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;white-space:nowrap}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

main{max-width:1280px;margin:0 auto;padding-block:20px 56px;padding-inline:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:700 40px/1.02 var(--f-display)}
h2{font:700 26px/1.1 var(--f-display)}
h3{font:600 15px/1.3 var(--f-body)}
.sub{color:var(--ink-2);margin:4px 0 0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chart-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chart-title p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.sw.do{box-shadow:inset 0 0 0 1px var(--line-2)}
.dot-v{width:12px;height:12px;border-radius:50%;background:var(--viatico);border:2px solid color-mix(in srgb,var(--viatico) 55%,#000);display:inline-block;flex:none}
.viatico-tag{background:var(--viatico);color:#2A2108;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.chipk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* month nav */
.mesnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.mesnav button{border:0;background:none;width:32px;height:32px;border-radius:9px;font-size:18px;color:var(--ink-2)}
.mesnav button:hover:not([disabled]){background:var(--surface-2)}
.mesnav button[disabled]{opacity:.3;cursor:default}
.mesnav select{border:0;background:none;font-weight:600;padding:6px 4px;font-size:15px;text-transform:capitalize}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;font-weight:500;color:var(--ink-2);white-space:nowrap;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}

/* login */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:15px}
textarea.input{min-height:84px;resize:vertical}
.err{color:var(--crit);font-size:13px;margin:0;min-height:1em}
.demo-note{border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px;color:var(--ink-2);font-size:13px;background:var(--surface-2)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;transition:border-color .12s,transform .12s}
button.kpi:hover,.kpi[data-drill]:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font:700 36px/1 var(--f-display)}
.kpi .v small{font:500 14px var(--f-body);color:var(--muted)}
.kpi .d{font-size:12px;color:var(--ink-2)}
.kpi .go{font-size:12px;color:var(--accent);font-weight:600;margin-top:auto}
.delta-up{color:var(--good)} .delta-dn{color:var(--crit)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);display:flex;gap:2px;overflow:hidden}
.meter span{height:100%}

/* verdicts */
.verdicts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left}
.verdict:hover{border-color:var(--ink-2)}
.verdict .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 18px/1 var(--f-display)}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.mid{background:var(--warn-soft);color:var(--warn)} .ic.bad{background:var(--crit-soft);color:var(--crit)} .ic.nc{background:var(--surface-2);color:var(--muted)}
.verdict b{display:block;font-size:14.5px}
.verdict p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.evid{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}

/* ranking */
.rank{display:grid;grid-template-columns:minmax(96px,150px) 1fr 64px;gap:7px 10px;align-items:center;font-size:13px}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.rank .track{position:relative;height:18px}
.rank .bar{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--c-vin)}
.rank .bar.lo{background:color-mix(in srgb,var(--c-vin) 45%,var(--surface))}
.rank .val{text-align:right;font-weight:600}
.rank .grp{grid-column:1/-1;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.rank .grp:first-child{margin-top:0;border-top:0;padding-top:0}
.rank .rowhit{display:contents}
.rank .rowhit:hover .nm{color:var(--accent);text-decoration:underline}
.meanline{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink-2);opacity:.7;pointer-events:none}
.band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 7%,transparent);pointer-events:none}
.rank-ax{display:grid;grid-template-columns:minmax(96px,150px) 1fr 64px;gap:10px;font-size:11px;color:var(--muted);margin-top:6px}

/* columns */
.cols{position:relative;height:220px;display:grid;grid-template-columns:30px 1fr;gap:6px}
.cols-y{position:relative;font-size:11px;color:var(--muted)}
.cols-y span{position:absolute;right:0;transform:translateY(50%)}
.cols-plot{position:relative;border-bottom:1px solid var(--line-2)}
.gridl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cols-bars{position:absolute;inset:0;display:flex;gap:6px;align-items:flex-end}
.col{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px;position:relative}
.col:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.col.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.col span{display:block;width:100%;flex:none}
.col span:last-child{border-radius:4px 4px 0 0}
.col .lab{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.cols-x{display:flex;gap:6px;margin-left:36px;font-size:11px;color:var(--muted);margin-top:4px}
.cols-x span{flex:1;text-align:center;text-transform:capitalize}
.cols-x span.sel{color:var(--ink);font-weight:700}

/* heatmap / matrix */
.hm-wrap{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}
.hm th{font-weight:600;color:var(--muted);font-size:11px;text-transform:capitalize;padding:2px;white-space:nowrap}
.hm th.nm{text-align:left;color:var(--ink-2);font-size:12.5px;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hm td{padding:0}
.hm .c{height:30px;min-width:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;font-variant-numeric:tabular-nums;border:0;width:100%}
.hm .c:hover{outline:2px solid var(--ink);outline-offset:1px}
.hm th.sel{color:var(--ink)}
.hm .grp th{padding-top:10px;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.s0{background:var(--surface-2);color:var(--muted)} .s1{background:var(--seq-1);color:#0d2744} .s2{background:var(--seq-2);color:#0d2744} .s3{background:var(--seq-3);color:#fff} .s4{background:var(--seq-4);color:#fff} .s5{background:var(--seq-5);color:#fff} .s6{background:var(--seq-6);color:#fff}
.d-2{background:var(--div-lo2);color:#fff} .d-1{background:var(--div-lo1);color:var(--ink)} .d0{background:var(--div-mid);color:var(--ink-2)} .d1{background:var(--div-hi1);color:var(--ink)} .d2{background:var(--div-hi2);color:#fff} .dna{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .s1,:root:not([data-theme="light"]) .s2{color:#e6eefb} :root:not([data-theme="light"]) .s6{color:#0d2744} }
:root[data-theme="dark"] .s1,:root[data-theme="dark"] .s2{color:#e6eefb} :root[data-theme="dark"] .s6{color:#0d2744}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-right:2px}
.alert{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;background:var(--surface);width:100%}
.alert:hover{border-color:var(--ink-2)}
.alert .sv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;grid-row:span 2}
.sv.alta{background:var(--crit-soft);color:var(--crit)} .sv.media{background:var(--warn-soft);color:var(--warn)} .sv.info{background:var(--info-soft);color:var(--info)}
.alert b{font-size:13.5px}
.alert p{margin:0;font-size:12.5px;color:var(--ink-2)}
.alert .tags{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

/* composition bars */
.q1{background:var(--sem1);color:var(--semi1)} .q2{background:var(--sem2);color:var(--semi2)} .q3{background:var(--sem3);color:var(--semi3)} .q4{background:var(--sem4);color:var(--semi4)} .q5{background:var(--sem5);color:var(--semi5)}
.semleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2);align-items:center}
.semleg span{display:inline-flex;align-items:center;gap:5px}
.semleg .sw{width:14px;height:14px}
.hm .c.q1,.hm .c.q2,.hm .c.q3,.hm .c.q4,.hm .c.q5{font-weight:700}
/* time distribution table */
table.tt{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%}
.tt th{font-weight:600;color:var(--ink-2);font-size:11.5px;padding:2px 4px;vertical-align:bottom;line-height:1.2}
.tt th small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px}
.tt th.nm{text-align:left;font-weight:500;font-size:12.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--surface);z-index:1}
.tt td{padding:0}
.tt .c{height:30px;min-width:52px;width:100%;border:0;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.tt .c:hover{outline:2px solid var(--ink);outline-offset:1px}
.tt .mini{display:flex;gap:1px;height:12px;width:110px;border-radius:3px;overflow:hidden}
.tt .mini span{height:100%}
.tt .grp th{padding-top:10px;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tt .ocu{border-left:2px solid var(--line-2)}
/* stats panel */
.st-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st-tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.st-tile b{font:700 26px/1 var(--f-display)}
.st-tile span{font-size:12px;color:var(--muted);line-height:1.3}
.st-tile .mtr{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.st-tile .mtr i{display:block;height:100%;background:var(--accent)}
.bd{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bd h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bd-row{display:grid;grid-template-columns:minmax(92px,1.3fr) minmax(40px,1fr) 30px 52px 60px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)}
.bd-row.hd{border-top:0;font-size:10.5px;color:var(--muted);padding-top:0}
.bd-row.hd span{text-align:right}
.bd-row.hd span:first-child{text-align:left}
.bd-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--c-vin);border-radius:4px}
.bd-n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bd-p{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.dist{display:grid;grid-template-columns:minmax(100px,150px) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.dist .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.dist .bar{display:flex;gap:2px;height:14px}
.dist .bar span{height:100%}
.dist .bar span:first-child{border-radius:4px 0 0 4px}.dist .bar span:last-child{border-radius:0 4px 4px 0}

/* vacation bars */
.vac{display:grid;grid-template-columns:minmax(100px,150px) 1fr 58px;gap:6px 10px;align-items:center;font-size:13px}
.vac .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.vac .track{position:relative;height:14px;display:flex;gap:2px}
.vac .track span{height:100%}
.vac .track .u{background:var(--c-vac);border-radius:4px 0 0 4px}
.vac .track .f{background:repeating-linear-gradient(135deg,var(--c-vac) 0 3px,color-mix(in srgb,var(--c-vac) 35%,var(--surface)) 3px 6px)}
.vac .m30{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink);pointer-events:none}
.vac .val{text-align:right;font-weight:600}

/* user */
.u-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.u-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c-vac) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:70px;height:70px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font:700 24px/1 var(--f-display)}
.ring small{font-size:10.5px;color:var(--muted)}
.cells30{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.cells30 span{height:16px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.cells30 span.u{background:var(--c-vac);box-shadow:none}
.cells30 span.f{background:repeating-linear-gradient(135deg,var(--c-vac) 0 3px,color-mix(in srgb,var(--c-vac) 35%,var(--surface)) 3px 6px);box-shadow:none}
.fl{display:flex;flex-direction:column}
.fl-m{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 0 4px}
.fl-i{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.fl-i:hover{background:var(--surface-2)}
.fl-i .dd{font:700 20px/1 var(--f-display)}
.fl-i .dd small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);text-transform:capitalize}
.fl-i .t{font-weight:600;font-size:13.5px}
.fl-i .m{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.scroll{max-height:460px;overflow:auto}

/* calendar */
.strip{display:flex;gap:2px;height:36px}
.strip span{flex:1;border-radius:3px;min-width:2px}
.strip-ax{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;border:0;padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-height:0;transition:transform .12s,filter .12s}
.tile .d{font-size:12px;opacity:.9;line-height:1}
.tile .c{font:700 clamp(13px,1.5vw,18px)/1 var(--f-display);display:flex;align-items:baseline;justify-content:space-between;gap:3px;min-width:0}
.tile .c span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .c small{font:500 9.5px/1 var(--f-body);opacity:.85;flex:none}
.tile .v{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--viatico);border:2px solid color-mix(in srgb,var(--viatico) 55%,#000)}
.tile:hover{filter:brightness(1.07);transform:translateY(-1px)}
.tile.today{outline:2px solid var(--ink);outline-offset:2px}
.tile.has-obs::after{content:"";position:absolute;left:6px;bottom:24px;width:6px;height:6px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--surface)}
.k-VIN{background:var(--c-vin);color:var(--i-vin)} .k-AUD{background:var(--c-aud);color:var(--i-aud)} .k-IET{background:var(--c-iet);color:var(--i-iet)}
.k-RES{background:var(--c-res);color:var(--i-res)} .k-VHA{background:var(--c-vha);color:var(--i-vha)} .k-GES{background:var(--c-ges);color:var(--i-ges)}
.k-VAC{background:var(--c-vac);color:var(--i-vac)} .k-DM{background:var(--c-dm);color:var(--i-dm)} .k-LIC{background:var(--c-lic);color:var(--i-lic)}
.k-DO{background:var(--c-do);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)} .k-FER{background:var(--c-fer);color:var(--ink)} .k-CUM{background:var(--c-cum);color:var(--ink)}
.k-BLA{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,color-mix(in srgb,var(--c-iet) 22%,var(--surface)) 5px 7px);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.k-SIN{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--muted) 22%,transparent) 5px 7px);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}

/* matrix full */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:72vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 2px;font-weight:600;color:var(--ink-2);min-width:58px}
.mx thead th small{display:block;font-weight:400;color:var(--muted)}
.mx .nm{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;min-width:170px;max-width:200px;text-align:left}
.mx thead .nm{z-index:4}
.mx .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .nm span{font-size:11px;color:var(--muted)}
.mx td.c{padding:2px}
.mx .cell{width:56px;height:40px;border-radius:7px;border:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px;font:700 13px/1 var(--f-display);position:relative}
.mx .cell small{font:500 9px/1 var(--f-body);opacity:.85;margin-top:2px}
.mx .cell .v{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--viatico)}
.mx.filtering .cell:not(.hit){opacity:.14}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* team by day */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.daybtn{flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center}
.daybtn small{font-size:10.5px;color:var(--muted)}
.daybtn b{font:700 20px/1.1 var(--f-display)}
.daybtn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daybtn[aria-selected="true"] small{color:inherit;opacity:.75}
.team{columns:2 360px;column-gap:16px}
.group{break-inside:avoid;margin-bottom:16px}
.group-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.group-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.person{padding:10px 14px;border:0;border-bottom:1px solid var(--line);display:block;width:100%;text-align:left;background:none}
.person:last-child{border-bottom:0}
.person:hover{background:var(--surface-2)}
.person b{display:block}
.person .t{font-size:13px;color:var(--ink-2)}
.person .m{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);white-space:pre-line}

/* status */
.status-list{display:flex;flex-direction:column;max-height:430px;overflow:auto}
.status-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.obs{display:flex;flex-direction:column;gap:10px}
.obs-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.obs-item .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.obs-item p{margin:0}
.empty{color:var(--muted);font-size:13px;padding:10px 0}

/* drawer / sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer>*{flex-shrink:0}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer h2{font-size:28px}
.xbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.dgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dgroup-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);font-weight:600;font-size:13.5px}
.drow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.drow .dt{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.drow .mt{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);white-space:pre-line}
.sheet{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--cat,var(--line));margin:auto}
.sheet h2{font-size:30px}
.sheet .meta{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:pre-line}
.scrim.center{justify-content:center;align-items:center;padding:16px}
@media (max-width:720px){
  .scrim{align-items:flex-end}
  .drawer{height:auto;max-height:90%;border-radius:18px 18px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-top:22px}
  .scrim.center{padding:0;align-items:flex-end}
  .sheet{border-radius:18px 18px 0 0;max-height:88%;margin:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.foot{color:var(--muted);font-size:12.5px;margin-top:14px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;max-width:260px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;font-size:13.5px}
details.codes summary{cursor:pointer;font-weight:600}
.codes-list{display:grid;gap:7px;margin-top:10px}
.codes-list div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.codes-list b{min-width:40px;font-family:var(--f-mono);font-size:12px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:980px){
  .grid2,.grid2e,.u-grid{grid-template-columns:1fr}
  .verdicts{grid-template-columns:1fr}
  .u-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .u-kpis .kvac{grid-column:1/-1;order:-1}
}
@media (max-width:720px){
  h1{font-size:32px}
  .brand small,.who .lbl{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:30px}
  .cal{gap:4px}
  .tile{padding:4px 5px;border-radius:8px}
  .tile .c small{display:none}
  .tile .d{font-size:10.5px}
  .tile .v{width:8px;height:8px;top:4px;right:4px;border-width:1px}
  .rank,.rank-ax{grid-template-columns:118px 1fr 44px}
  .dist,.vac{grid-template-columns:92px 1fr}
  .vac .val{display:none}
  .cols-bars,.cols-x{gap:3px}
  .cols-x span{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= Acceso (inicio de sesión) ================= */
:root{ --brand-deep:#1E3A8A; --brand-deep-2:#142863; --brand-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --brand-deep:#1F3270; --brand-deep-2:#141F47; } }
:root[data-theme="dark"]{ --brand-deep:#1F3270; --brand-deep-2:#141F47; }
.auth{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:8px 0 24px}
.auth-card{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.auth-side{background:linear-gradient(165deg,var(--brand-deep),var(--brand-deep-2));color:var(--brand-ink);padding:38px 36px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.auth-side .eyebrow{color:color-mix(in srgb,var(--brand-ink) 72%,transparent)}
.auth-side h1{font-size:50px;color:var(--brand-ink)}
.auth-side p{margin:0;color:color-mix(in srgb,var(--brand-ink) 82%,transparent);max-width:38ch}
.auth-side .brand-mark{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.14);color:#fff}
.auth-side .brand-mark svg{width:24px;height:24px}
.auth-side .feat{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:12px;font-size:13.5px}
.auth-side .feat li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;color:color-mix(in srgb,var(--brand-ink) 90%,transparent)}
.auth-side .feat i{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal;font-size:12px}
.auth-side .runway{position:absolute;left:0;right:0;bottom:0;height:64px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 26px,transparent 26px 48px) center/100% 3px no-repeat;opacity:.55}
.auth-side .small{margin-top:auto;font-size:12px;color:color-mix(in srgb,var(--brand-ink) 65%,transparent);position:relative}
.auth-main{padding:38px 40px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.auth-main h2{font-size:32px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.pw{position:relative}
.pw .input{padding-right:84px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:6px}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.msg{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.info{background:var(--info-soft);color:var(--info)}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.reqs li::before{content:"○";display:inline-block;width:16px}
.reqs li.ok{color:var(--good)}
.reqs li.ok::before{content:"✓"}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.block{width:100%;justify-content:center;padding:11px 14px;font-size:14.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);font-weight:600;padding-inline:6px}
.input.code{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;align-content:center;min-height:55vh;gap:14px;color:var(--muted)}
.loading .spin{width:26px;height:26px;border-width:3px;color:var(--accent)}

a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}

/* menú de cuenta */
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px 3px 3px;background:var(--surface)}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover{border-color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:40}
.menu-pop .mh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:grid;gap:2px}
.menu-pop button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:13.5px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop button.danger{color:var(--crit)}

/* tablas de administración */
.dt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt tr:last-child td{border-bottom:0}
table.dt td.acts{white-space:nowrap;text-align:right}
table.dt .sm2{display:block;color:var(--muted);font-size:12px}
.code-big{font:600 30px/1 var(--f-mono);letter-spacing:.14em;text-align:center;padding:18px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-2);user-select:all}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;margin:0;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--good)}
.toggle input:checked::after{left:16px}
.empty-state{text-align:center;padding:36px 18px;display:grid;gap:8px;justify-items:center}
.src-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.form-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}

@media (max-width:860px){
  .auth-card{grid-template-columns:1fr}
  .auth-side{padding:24px 22px 30px}
  .auth-side h1{font-size:38px}
  .auth-side .feat,.auth-side .small{display:none}
  .auth-main{padding:26px 22px}
  .src-grid,.form-grid{grid-template-columns:1fr}
  .menu>summary .lbl{display:none}
}
#fin-estilos{--fin:1}
</style>
