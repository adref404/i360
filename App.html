<script>
/* App — núcleo: estado, servidor, inicio de sesión, pestañas y eventos */
/* =====================================================================
   Rol de instructores LP — interfaz
   Los datos llegan del servidor según la sesión (apiDatos). Nada del rol
   está incrustado en la página.
   ===================================================================== */

/* ============ Utilidades ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DOWS = ["dom","lun","mar","mié","jue","vie","sáb"];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const f1 = n => (Math.round(n*10)/10).toLocaleString("es-PE",{minimumFractionDigits:0,maximumFractionDigits:1});
const pct = n => Math.round(n*100)+"%";
const mesCorto = mes => mesInfo(mes).nombre.slice(0,3);
const mesLargo = mes => cap(mesInfo(mes).nombre)+" "+mesInfo(mes).y;
function fechaCorta(iso){ if(!iso) return ""; try{ const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleDateString("es-PE",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function fechaLarga(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleDateString("es-PE",{day:"numeric",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}); }
const fmtISO = s => s ? s.split("-").reverse().join("/") : "—";
let HOY = new Date();

/* Categorías del tablero (6 de trabajo + estados) */
const KC = {
  VIN:{nom:"Vuelo de instrucción o chequeo", corto:"Vuelo INS", color:"var(--c-vin)"},
  AUD:{nom:"Auditoría e IOSA", corto:"Auditoría", color:"var(--c-aud)"},
  IET:{nom:"Instrucción en tierra (iniciales, RTI, revas, prácticas)", corto:"Tierra", color:"var(--c-iet)"},
  RES:{nom:"Reserva IET", corto:"Reserva", color:"var(--c-res)"},
  VHA:{nom:"Vuelo propio (habilitación, exp. reciente, alumno, traslado)", corto:"Vuelo propio", color:"var(--c-vha)"},
  GES:{nom:"Gestión y formación (HO File, reuniones, cursos, TTT)", corto:"Gestión", color:"var(--c-ges)"},
  VAC:{nom:"Vacaciones", corto:"Vacaciones", color:"var(--c-vac)"},
  DM: {nom:"Descanso médico (SICK)", corto:"SICK", color:"var(--c-dm)"},
  LIC:{nom:"Licencia u otra ausencia (LP, NME)", corto:"Licencia", color:"var(--c-lic)"},
  BLA:{nom:"Día en blanco (junto a vuelo o actividad)", corto:"Blanco", color:"var(--c-fer)"},
  DO: {nom:"Día libre (DO / FDS)", corto:"Libre", color:"var(--c-do)"},
  FER:{nom:"Feriado", corto:"Feriado", color:"var(--c-fer)"},
  CUM:{nom:"Cumpleaños", corto:"Cumpleaños", color:"var(--c-cum)"},
  SIN:{nom:"Sin asignar en el rol", corto:"Sin asignar", color:"transparent"}
};
const WORK = ["VIN","AUD","IET","RES","VHA","GES"];
const TODAS = ["VIN","AUD","IET","RES","VHA","GES","BLA","VAC","DM","LIC","CUM","FER","DO","SIN"];
const sw = k => `<i class="sw ${k==="DO"?"do":""}" style="background:${KC[k].color}${k==="SIN"||k==="BLA"?";box-shadow:inset 0 0 0 1px var(--line-2)":""}"></i>`;
const ICON_PLANE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>`;

const TAB_NOMBRE = {ind:"Indicadores", rol:"Rol completo", dia:"Equipo por día", inst:"Por instructor", vac:"Vacaciones", int:"Intercambios de rol", cargar:"Actualizar rol", colores:"Tipos y colores", usuarios:"Usuarios y accesos", mi:"Mi rol"};

/* ============ Estado ============ */
const S = {
  token:null, usuario:null, vistas:[], equipo:false, hoy:null, baseUrl:"",
  resp:{}, mes:null, modo:"anio", vVuelo:"tasa", distModo:"pct",
  tab:null, uFiltroMes:null, uTipo:"todos", uAlcV:"mes", uAlcO:"mes", dia:null, filtro:null, busca:"", verBp:null,
  xlsxPrev:null, vac:null, selVac:new Set(), vacSim:[], vacAnio:null, selCom:"", intercambios:[], notifFiltro:"todas", tipos:null, tiposEdit:[], tiposSucio:false, colImport:null, colVista:null, colMes:"", colTest:"", fuentes:null, fuentesMsg:"", fuentesCargando:false, adm:null, admCargando:false, buscaU:"", filtroU:"todos",
  login:{modo:"login", usuario:"", err:"", ok:"", google:""}, listo:false
};
let MO = construirModelo({meses:[]});
let STC = {};
function ST(bp, meses){ const k=bp+"|"+meses.join(","); return STC[k] || (STC[k]=stats(MO,bp,meses,HOY)); }
const PER = () => periodo(MO, S.mes, S.modo);
const anioHasta = mes => periodo(MO, mes, "anio");
const mesesDelAnio = mes => MO.orden.filter(m=>m.startsWith(mes.slice(0,4)));
const rosterMes = mes => (MO.meses[mes]||{proc:[]}).proc;
const mesHoy = () => (S.hoy||"").slice(0,7);
const esEditable = mes => !!mes && mes >= mesHoy();
const respDe = (bp,mes=S.mes) => S.resp[mes+"_"+bp] || null;
const puede = v => S.vistas.includes(v);
const esAdmin = () => S.usuario && S.usuario.rol==="admin";
/* Nivel del perfil de acceso en una sección: 0 sin acceso · 1 ver · 2 gestionar (el servidor también lo valida) */
const nivelSec = k => S.usuario && S.usuario.niveles ? (S.usuario.niveles[k]||0) : (esAdmin() ? 2 : 0);   // instructor focal: máximo 1
const gestiona = k => nivelSec(k) >= 2;
const SECC_CON_ACCIONES = ["vac","int","cargar","colores","usuarios"];

/* Registro de acciones de detalle (drill-down) por render */
let DR = {}; let drn=0;
function drill(fn){ const id="d"+(++drn); DR[id]=fn; return `data-drill="${id}"`; }

/* ============ Conexión con el servidor ============ */
const TOKEN_KEY = "rolins.token";
function leerToken(){ try{ return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || null; }catch(e){ return null; } }
function guardarToken(t, recordar){ try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); (recordar?localStorage:sessionStorage).setItem(TOKEN_KEY,t); }catch(e){} }
function borrarToken(){ try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); }catch(e){} }
const hayServidor = () => typeof google!=="undefined" && google.script && google.script.run;
function dispositivo(){
  const u=navigator.userAgent||"";
  const tiene=t=>u.indexOf(t)>=0;
  const nav=tiene("Edg"+"\x2F")?"Edge":tiene("OPR"+"\x2F")?"Opera":tiene("Chrome"+"\x2F")?"Chrome":tiene("Firefox"+"\x2F")?"Firefox":tiene("Safari"+"\x2F")?"Safari":"Navegador";
  const so=/Windows/.test(u)?"Windows":/Android/.test(u)?"Android":/iPhone|iPad/.test(u)?"iOS":/Mac OS/.test(u)?"macOS":/Linux/.test(u)?"Linux":"";
  return nav+(so?" en "+so:"");
}
function api(fn, ...args){
  return new Promise((ok0,no0)=>{
    if(!hayServidor()){ no0(new Error("Abre la aplicación desde su enlace de Apps Script.")); return; }
    let fin=false;
    const ok=v=>{ if(fin) return; fin=true; clearTimeout(t); ok0(v); };
    const no=e=>{ if(fin) return; fin=true; clearTimeout(t); no0(e); };
    const t=setTimeout(()=>{ const e=new Error("El servidor no respondió en 45 segundos. Revisa tu conexión e intenta de nuevo. Si tienes varias cuentas de Google abiertas, usa una ventana de incógnito."); e.codigo="TIEMPO"; no(e); },45000);
    google.script.run
      .withSuccessHandler(r=>{
        if(r && r.ok) return ok(r.data);
        if(r==null || typeof r!=="object" || !("ok" in r)){ const e=new Error("El servidor respondió algo inesperado al llamar a "+fn+". ¿Quedó el Server.gs antiguo o la implementación no tiene la versión nueva?"); e.codigo="FORMATO"; return no(e); }
        const e=new Error((r&&r.error)||"No se pudo completar la acción."); e.codigo=r&&r.codigo;
        if(e.codigo==="SESION" && S.usuario){ sesionTerminada(e.message); }
        if(e.codigo==="YA_RESUELTO" && S.usuario){ yaResueltoAviso(e.message); }
        if(e.codigo==="ROL_CAMBIO" && S.usuario){ yaResueltoAviso(e.message, "El rol cambió"); }
        no(e);
      })
      .withFailureHandler(err=>{ const det=err&&err.message?err.message:String(err||""); console.error("Apps Script",fn,err);
        const e=new Error(/not found|no se encontr|is not a function|no es una funci/i.test(det)?`El servidor no tiene la función ${fn}: la implementación no tiene la versión nueva del código.`:`No se pudo comunicar con el servidor (${det||"sin detalle"}). Si tienes varias cuentas de Google abiertas, abre la app en una ventana de incógnito.`); e.detalle=det; no(e); })
      [fn](...args);
  });
}
function sesionTerminada(msg){
  borrarToken(); S.token=null; S.usuario=null; S.vistas=[]; S.listo=false;
  S.login={...S.login, modo:"login", err:msg||"Tu sesión terminó. Vuelve a ingresar.", ok:""};
  document.querySelectorAll(".scrim").forEach(x=>x.remove());
  render();
}

/* ============ Arranque y sesión ============ */
async function boot(){
  try{ await arrancar(); }
  catch(e){ console.error(e); if(window.__fallaArranque && !S.usuario && !document.querySelector("#fLogin")) window.__fallaArranque("No se pudo iniciar la aplicación", e.message); }
}
async function arrancar(){
  if(!hayServidor()){ $("#app").innerHTML=`<div class="card empty-state" style="margin-top:40px"><h2>Abre la aplicación desde su enlace</h2><p class="hint">Este archivo funciona dentro de Google Apps Script.</p></div>`; return; }
  const t=leerToken();
  try{
    const r=await api("apiInicio", t);
    S.login.google=r.google||"";
    if(r.usuario){ S.token=t; S.usuario=r.usuario; await cargarDatos(false); }
    else { borrarToken(); render(); }
  }catch(e){ S.login.err=e.message; render(); }
}
async function cargarDatos(mantener){
  window.__appIniciada=true;
  if(!S.listo){ document.body.classList.add("iniciando"); $("#app").innerHTML=splashHTML("Cargando tu información…"); pintarCabecera(); }
  try{
    const P=await api("apiDatos", S.token);
    aplicarDatos(P, mantener);
  }catch(e){
    if(e.codigo==="SESION") return;
    document.body.classList.remove("iniciando");
    $("#app").innerHTML=`<div class="card empty-state" style="margin-top:30px"><h2>No pudimos cargar el rol</h2><p class="hint">${esc(e.message)}</p><button class="btn primary" id="reintentar">Reintentar</button></div>`;
    const b=$("#reintentar"); if(b) b.onclick=()=>cargarDatos(mantener);
  }
}
function aplicarDatos(P, mantener){
  S.usuario=P.usuario; S.vistas=P.usuario.vistas||[]; S.equipo=!!P.usuario.equipo; S.hoy=P.hoy; S.baseUrl=P.baseUrl||"";
  S.resp=P.respuestas||{};
  S.vac=P.vac||{personas:{}, solicitudes:[], cfg:null, ventanaUltima:null, fuente:""}; resetVac();
  S.intercambios=P.intercambios||[]; S.intAprob=P.intAprob||null; S.intConFinal=!!P.intConFinal;
  S.do=P.do||null; S.selDO=null; S.doOpc=null;
  marcaRoles=P.cambioRoles||"";
  const [y,m,d]=P.hoy.split("-").map(Number); HOY=new Date(y,m-1,d,12);
  MO=construirModelo(P); STC={};
  if(!mantener || !MO.orden.includes(S.mes)) S.mes=mesInicial();
  if(!S.tab || !puede(S.tab)) S.tab=S.vistas[0]||"mi";
  S.listo=true;
  render();
}
function mesInicial(){
  if(!MO.orden.length) return null;
  const h=mesHoy();
  if(MO.orden.includes(h)) return h;
  const prev=MO.orden.filter(x=>x<=h);
  return prev.length? prev[prev.length-1] : MO.orden[0];
}
async function recargar(){ STC={}; await cargarDatos(true); }

/* ============ Actualización automática ============
   Cada 60 s (con la pestaña visible) se pregunta al servidor si cambió algún rol (consulta liviana: no lee hojas). Si cambió, se recargan los datos
   sin recargar la página. Se espera si hay un diálogo abierto, algo escrito o una selección sin enviar. */
let marcaRoles="", ultimaRevision=0;
async function revisarCambios(){
  if(!S.usuario || !S.listo || document.visibilityState!=="visible") return;
  if(Date.now()-ultimaRevision<20000) return;   // al cambiar de pestaña seguido no se repite la consulta
  ultimaRevision=Date.now();
  try{
    const r=await api("apiCambios");
    if(!r || r.roles===marcaRoles) return;
    const ocupado=document.querySelector(".scrim") || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"") || (S.selVac&&S.selVac.size) || S.selDO;
    if(ocupado) return; // se reintenta en la próxima vuelta
    await recargar(); toast("El rol se actualizó");
  }catch(e){ /* sin conexión: se reintenta */ }
}
setInterval(revisarCambios, 60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") revisarCambios(); });

/* ============ Render raíz ============ */
function pintarCabecera(){
  const top=$("#topMes"), who=$("#who");
  const conMenu = !!(S.usuario && S.listo && !(S.vistas.length===1 && S.vistas[0]==="mi"));
  let nt=$("#navToggle");
  if(conMenu && !nt){ nt=document.createElement("button"); nt.id="navToggle"; nt.type="button"; nt.className="nav-toggle"; nt.setAttribute("aria-label","Menú");
    nt.innerHTML=svgUI(ICONO_UI.menu); nt.onclick=alternarMenu; document.querySelector(".top-in").prepend(nt); }
  if(nt) nt.hidden=!conMenu;
  if(!S.usuario){ top.textContent="Instructores LP"; who.innerHTML=""; return; }
  const mT = S.mes && MO.orden.includes(S.mes) ? S.mes : mesInicial();
  if(mT) top.textContent = S.equipo ? `Freeze ${mesLargo(mT)} · ${rosterMes(mT).length} instructores` : `Freeze ${mesLargo(mT)}`;
  else top.textContent="Instructores LP";
  const u=S.usuario, ini=(u.nombre||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  who.innerHTML=`${S.listo?campanaHTML():""}<details class="menu" id="menuCuenta"><summary aria-label="Tu cuenta"><span class="avatar">${esc(ini)}${u.foto?`<img src="${esc(u.foto)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span><span class="lbl" style="font-weight:600;color:var(--ink)">${esc(u.nombre)}</span><span class="pill ${u.rol==="admin"?"acc":"info"} lbl" style="padding:1px 8px">${esc(u.rolTxt)}</span></summary>
    <div class="menu-pop" role="menu"><div class="mh"><b>${esc(u.nombre)}</b><span class="hint mono">BP ${esc(u.bp)}</span>${u.cargo||u.area?`<span class="hint">${esc([u.cargo,u.area].filter(Boolean).join(" · "))}</span>`:""}${u.correo?`<span class="hint">${esc(u.correo)}</span>`:""}<span class="hint">${esc(u.rolTxt)}</span></div>
      <button type="button" data-act="preferencias" role="menuitem">Preferencias</button>
      <button type="button" data-act="cambiarClave" role="menuitem">Cambiar contraseña</button>
      <button type="button" data-act="salir" class="danger" role="menuitem">Cerrar sesión</button></div></details>`;
}
function render(){
  window.__appIniciada=true;
  DR={}; drn=0; $("#tip").hidden=true;
  if(S.usuario && S.listo && S.mes){ const mP = MO.orden.includes(S.mes) ? S.mes : mesInicial(); if(mP) asignarPerfiles(MO, mP.slice(0,4)); }
  pintarCabecera();
  const app=$("#app");
  if(!S.usuario) app.innerHTML=vistaLogin();
  else if(!S.listo) return;
  else app.innerHTML=vistaShell();
  document.body.classList.toggle("con-side", !!app.querySelector(".shell"));
  document.body.classList.remove("iniciando");
  document.body.classList.toggle("sin-sesion", !S.usuario);
  if(!document.body.dataset.menuIni && app.querySelector(".shell")){ document.body.classList.toggle("side-mini", miniGuardado()); document.body.dataset.menuIni="1"; }
  wire();
}
/* Meses navegables: en Mi rol y Por instructor, todos los meses (para ver vacaciones aunque no haya rol); en el resto, solo los meses con rol */
const vistaPersona = () => S.tab==="inst" || S.tab==="mi" || (S.vistas.length===1 && S.vistas[0]==="mi");
const listaMesesActual = () => vistaPersona() ? mesesUsuario() : MO.orden;
function mesNav(lista){
  lista = lista || MO.orden;
  const i=lista.indexOf(S.mes), h=mesHoy(), conRol=lista!==MO.orden;
  return `<div class="mesnav" role="group" aria-label="Mes"><button data-messtep="-1" ${i<=0?"disabled":""} aria-label="Mes anterior">‹</button>
    <select id="selMes" aria-label="Elegir mes">${lista.map(m=>`<option value="${m}" ${m===S.mes?"selected":""}>${mesLargo(m)}${m===h?" · en curso":(!conRol&&m>h)?" · próximo":""}${MO.meses[m]&&MO.meses[m].oculto?" · oculto a instructores":""}</option>`).join("")}</select>
    <button data-messtep="1" ${i>=lista.length-1?"disabled":""} aria-label="Mes siguiente">›</button></div>`;
}
function irAMes(m){ if(!listaMesesActual().includes(m)) return; S.mes=m; S.uFiltroMes=null; S.dia=null; render(); }

/* ============ Inicio de sesión ============ */
function campoClave(id, label, auto, extra){
  return `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="input" id="${id}" type="password" autocomplete="${auto}" required ${extra||""}><button type="button" class="pw-toggle" data-pw="${id}" aria-label="Mostrar contraseña">Mostrar</button></div></div>`;
}
function reqsHTML(){ return `<ul class="reqs" id="reqs"><li data-r="len">Al menos 8 caracteres</li><li data-r="mix">Letras y números</li><li data-r="bp">No contiene tu BP</li><li data-r="eq">Las dos coinciden</li></ul>`; }
function vistaLogin(){
  const L=S.login;
  const msg=(L.err?`<div class="msg err" role="alert">${esc(L.err)}</div>`:"")+(L.ok?`<div class="msg ok" role="status">${esc(L.ok)}</div>`:"");
  let form="";
  if(L.modo==="login") form=`
    <div><span class="eyebrow">Acceso</span><h2>Iniciar sesión</h2><p class="sub">Ingresa con tu BP o tu correo corporativo.</p></div>
    ${msg}
    <form class="auth-form" id="fLogin" novalidate>
      <div class="field"><label for="lgUser">Usuario</label><input class="input" id="lgUser" autocomplete="username" inputmode="email" placeholder="BP o correo corporativo" value="${esc(L.usuario)}" required></div>
      ${campoClave("lgPass","Contraseña","current-password")}
      <div class="auth-row"><label class="check"><input type="checkbox" id="lgRec"> Mantener mi sesión iniciada</label><button type="button" class="btn ghost sm" data-lmodo="olvido">¿Olvidaste tu contraseña?</button></div>
      <button class="btn primary block" type="submit" id="lgBtn">Ingresar</button>
    </form>
    <div class="divider">¿Primera vez?</div>
    <button class="btn block" type="button" data-lmodo="activar">Genera código y activa tu cuenta</button>
    ${L.google?`<button class="btn block" type="button" id="lgGoogle">Continuar como ${esc(L.google)}</button>`:""}`;
  else if(L.modo==="activar") form=`
    <div><span class="eyebrow">Primer ingreso o restablecer</span><h2>Crea tu contraseña</h2><p class="sub">Usa el código temporal que te dio coordinación o que llegó a tu correo. Sirve una sola vez.</p></div>
    ${msg}
    <form class="auth-form" id="fActivar" novalidate>
      <div class="field"><label for="acUser">Usuario</label><input class="input" id="acUser" autocomplete="username" placeholder="BP o correo corporativo" value="${esc(L.usuario)}" required></div>
      <div class="field"><label for="acCode">Código temporal</label><input class="input code" id="acCode" autocomplete="one-time-code" placeholder="XXXX-XXXX" maxlength="12" required></div>
      ${campoClave("acPass","Nueva contraseña","new-password")}
      ${campoClave("acPass2","Repite la contraseña","new-password")}
      ${reqsHTML()}
      <label class="check"><input type="checkbox" id="acRec"> Mantener mi sesión iniciada</label>
      <button class="btn primary block" type="submit" id="acBtn">Crear contraseña e ingresar</button>
    </form>
    <button class="btn ghost" type="button" data-lmodo="login">← Volver a iniciar sesión</button>`;
  else form=`
    <div><span class="eyebrow">Restablecer contraseña</span><h2>¿Olvidaste tu contraseña?</h2><p class="sub">Si tu usuario tiene correo corporativo registrado, te enviaremos un código. Si no, pídeselo a coordinación.</p></div>
    ${msg}
    <form class="auth-form" id="fOlvido" novalidate>
      <div class="field"><label for="olUser">Usuario</label><input class="input" id="olUser" autocomplete="username" placeholder="BP o correo corporativo" value="${esc(L.usuario)}" required></div>
      <button class="btn primary block" type="submit" id="olBtn">Enviarme un código</button>
    </form>
    <button class="btn block" type="button" data-lmodo="activar">Ya tengo un código</button>
    <button class="btn ghost" type="button" data-lmodo="login">← Volver a iniciar sesión</button>`;
  return `<section class="auth"><div class="auth-card">
    <div class="auth-side">
      ${window.FONDO_INICIO?`<img class="auth-bg" src="${esc(window.FONDO_INICIO)}" alt="" onload="this.parentNode.classList.add('con-fondo')" onerror="this.remove()">`:""}
      ${logoHTML('completo','oscuro')}
      <div class="auth-hero"><h1>${esc(window.NOMBRE_APP||"i360")}</h1><p>Gestión de instructores LP</p></div>
      <p class="small">LATAM Airlines · Uso interno${window.VERSION_APP?` · v${esc(window.VERSION_APP)}`:""}</p>
      <div class="runway" aria-hidden="true"></div>
    </div>
    <div class="auth-main">${form}</div>
  </div></section>`;
}
function setCargando(btn, on, txt){ if(!btn) return; if(on){ btn.dataset.txt=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>${esc(txt||"Un momento…")}`; } else { btn.disabled=false; if(btn.dataset.txt) btn.innerHTML=btn.dataset.txt; } }
function actualizarReqs(passId, pass2Id, userId){
  const p=($("#"+passId)||{}).value||"", p2=($("#"+pass2Id)||{}).value||"", u=(($("#"+userId)||{}).value||S.usuario&&S.usuario.bp||"").replace(/\D/g,"");
  const set=(r,ok)=>{ const li=document.querySelector(`#reqs [data-r="${r}"]`); if(li) li.classList.toggle("ok",ok); };
  set("len",p.length>=8); set("mix",/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(p)&&/\d/.test(p)); set("bp",!!p&&!(u&&u.length>=4&&p.includes(u))); set("eq",!!p&&p===p2);
}
function wireLogin(){
  document.querySelectorAll("[data-lmodo]").forEach(b=>b.onclick=()=>{ const u=($("#lgUser")||$("#acUser")||$("#olUser")||{}).value; if(u!=null) S.login.usuario=u.trim(); S.login.modo=b.dataset.lmodo; S.login.err=""; S.login.ok=""; render(); const f=$(".auth-form input"); if(f) f.focus(); });
  const fl=$("#fLogin");
  if(fl){ (S.login.usuario?$("#lgPass"):$("#lgUser")).focus();
    fl.onsubmit=async e=>{ e.preventDefault(); const u=$("#lgUser").value.trim(), p=$("#lgPass").value, rec=$("#lgRec").checked;
      S.login.usuario=u;
      if(!u||!p){ S.login.err="Escribe tu usuario y tu contraseña."; render(); return; }
      setCargando($("#lgBtn"),true,"Verificando…");
      try{ const r=await api("apiLogin",u,p,rec,dispositivo()); entrar(r); }
      catch(err){ S.login.err=err.message; S.login.ok=""; render(); const pp=$("#lgPass"); if(pp) pp.focus(); } };
  }
  const fa=$("#fActivar");
  if(fa){ const upd=()=>actualizarReqs("acPass","acPass2","acUser"); ["acPass","acPass2","acUser"].forEach(id=>$("#"+id).addEventListener("input",upd)); upd();
    $("#acCode").addEventListener("input",e=>{ const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8); e.target.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v; });
    fa.onsubmit=async e=>{ e.preventDefault(); const u=$("#acUser").value.trim(), c=$("#acCode").value, p=$("#acPass").value, p2=$("#acPass2").value, rec=$("#acRec").checked;
      S.login.usuario=u;
      const fail=m=>{ S.login.err=m; S.login.ok=""; render(); };
      if(!u||!c) return fail("Escribe tu usuario y el código temporal.");
      if(p.length<8||!/\d/.test(p)||!/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(p)) return fail("La contraseña debe tener al menos 8 caracteres y combinar letras y números.");
      if(p!==p2) return fail("Las contraseñas no coinciden.");
      setCargando($("#acBtn"),true,"Creando tu contraseña…");
      try{ const r=await api("apiActivar",u,c,p,rec,dispositivo()); entrar(r); toast("Listo. Tu contraseña quedó guardada."); }
      catch(err){ fail(err.message); } };
  }
  const fo=$("#fOlvido");
  if(fo) fo.onsubmit=async e=>{ e.preventDefault(); const u=$("#olUser").value.trim(); S.login.usuario=u;
    if(!u){ S.login.err="Escribe tu BP o tu correo."; render(); return; }
    setCargando($("#olBtn"),true,"Enviando…");
    try{ const r=await api("apiSolicitarCodigo",u,dispositivo()); S.login.modo="activar"; S.login.ok=r.mensaje; S.login.err=""; render(); }
    catch(err){ S.login.err=err.message; render(); } };
  const g=$("#lgGoogle");
  if(g) g.onclick=async()=>{ setCargando(g,true,"Ingresando…"); try{ entrar(await api("apiLoginGoogle",true,dispositivo())); }catch(err){ S.login.err=err.message; render(); } };
}
function entrar(r){
  guardarToken(r.token, r.recordar);
  S.token=r.token; S.usuario=r.usuario; S.listo=false;
  S.login={modo:"login", usuario:"", err:"", ok:"", google:S.login.google};
  S.tab=null; S.fuentes=null; S.adm=null; S.verBp=null; S.xlsxPrev=null; S.selVac.clear();
  cargarDatos(false); scrollTo(0,0);
}
/* Otro usuario resolvió lo mismo antes: se avisa, se cierran los diálogos y se recargan los datos */
let avisoConflicto=false;
function yaResueltoAviso(msg, titulo){
  if(avisoConflicto) return; avisoConflicto=true;
  document.querySelectorAll(".scrim").forEach(x=>x.remove());
  const sc=document.createElement("div"); sc.className="scrim center";
  sc.innerHTML=`<div class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="yrT"><span class="confirm-ic info" aria-hidden="true">${svgUI('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>')}</span>
    <h2 id="yrT">${esc(titulo||"Ya se resolvió")}</h2><p class="hint">${esc(msg)}</p><div class="row confirm-acts"><button class="btn primary" type="button" id="yrOk">Entendido</button></div></div>`;
  document.body.appendChild(sc);
  const ok=()=>{ sc.remove(); avisoConflicto=false; };
  $("#yrOk",sc).onclick=ok; sc.addEventListener("click",e=>{ if(e.target===sc) ok(); });
  S.fuentes=null; S.adm=null; recargar().catch(()=>{});
}
function confirmarSalir(){
  const sc=document.createElement("div"); sc.className="scrim center";
  sc.innerHTML=`<div class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="csT" aria-describedby="csD">
    <span class="confirm-ic" aria-hidden="true">${svgUI(ICONO_UI.salir)}</span>
    <h2 id="csT">¿Cerrar sesión?</h2><p class="hint" id="csD">Tendrás que ingresar de nuevo con tu usuario y contraseña${S.usuario&&S.usuario.nombre?`, ${esc(S.usuario.nombre.split(" ")[0])}`:""}.</p>
    <div class="row confirm-acts"><button class="btn" type="button" id="csNo">Cancelar</button><button class="btn danger" type="button" id="csSi">Cerrar sesión</button></div></div>`;
  document.body.appendChild(sc);
  const close=()=>{ sc.remove(); document.removeEventListener("keydown",k); }; const k=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",k); sc.addEventListener("click",e=>{ if(e.target===sc) close(); });
  $("#csNo",sc).onclick=close; $("#csSi",sc).onclick=()=>{ close(); salir(); };
  setTimeout(()=>$("#csNo",sc).focus(),30);
}
async function salir(){
  const t=S.token;

  S.login={modo:"login", usuario:"", err:"", ok:"Cerraste tu sesión.", google:S.login.google}; S.selVac.clear(); S.vac=null;
  render();
  try{ await api("apiLogout",t,dispositivo()); }catch(e){}
}

function wirePw(root=document){ root.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{ const i=$("#"+b.dataset.pw, root.nodeType===9?document:root)||$("#"+b.dataset.pw); const ver=i.type==="password"; i.type=ver?"text":"password"; b.textContent=ver?"Ocultar":"Mostrar"; b.setAttribute("aria-label",ver?"Ocultar contraseña":"Mostrar contraseña"); }); }

function vistaShell(){
  const sinDatos = !MO.orden.length || !S.mes;
  const tabs=S.vistas;
  if(tabs.length===1 && tabs[0]==="mi"){
    if(sinDatos) return vacioRol();
    return vistaUsuario(S.usuario.bp,false);
  }
  const conMes=["ind","rol","dia"].includes(S.tab);
  if(!vistaPersona() && S.mes && !MO.orden.includes(S.mes)) S.mes=mesInicial();
  let body="";
  if(sinDatos && !["cargar","usuarios"].includes(S.tab)) body=vacioRol();
  else if(S.tab==="ind") body=admIndicadores();
  else if(S.tab==="rol") body=admMatriz();
  else if(S.tab==="dia") body=admDia();
  else if(S.tab==="inst") body=admInst();
  else if(S.tab==="cargar") body=admCargar();
  else if(S.tab==="usuarios") body=admUsuarios();
  else if(S.tab==="vac") body=admVac();
  else if(S.tab==="int") body=admIntercambios();
  else if(S.tab==="colores") body=admColores();
  else if(S.tab==="mi") body=vistaUsuario(S.usuario.bp,false);
  const titulo = S.tab==="ind"?"Indicadores del Freeze" : conMes? `Rol de ${mesInfo(S.mes).nombre} ${mesInfo(S.mes).y}` : TAB_NOMBRE[S.tab];
  const encabezado = ["inst","mi"].includes(S.tab) ? "" :
    `<div class="pagehead"><div><span class="eyebrow">${esAdmin()?"Panel de coordinación · Instructores LP":"Instructores LP"}</span><h1>${esc(titulo)}</h1></div>${conMes&&!sinDatos?mesNav():""}</div>`;
  const ro = nivelSec(S.tab)>=1 && SECC_CON_ACCIONES.includes(S.tab) && !gestiona(S.tab);
  const aviso = ro ? `<div class="ro-aviso" role="note">${svgUI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')}<span><b>Solo lectura.</b> Tu perfil (${esc(S.usuario.perfil||"")}) permite ver esta sección, pero no aprobar ni editar.</span></div>` : "";
  return `<div class="shell">${barraLateral(tabs)}<div class="shell-main${ro?" ro":""}">${encabezado}${aviso}${body}</div></div>`;
}

function pendientesNav(k){
  if(!gestiona(k) && k!=="int") return 0;
  try{
    if(k==="vac"){ const s=(S.vac&&S.vac.solicitudes)||[]; return s.filter(x=>x.estado==="pendiente").length+s.filter(revisionPendiente).length+DOD().solicitudes.filter(x=>x.estado==="pendiente").length; }

  }catch(e){}
  return 0;
}

function aplicarTema(t){
  try{ if(t==="sistema") localStorage.removeItem("rolins.tema"); else localStorage.setItem("rolins.tema",t); }catch(e){}
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
}

    `<div class="stack" style="gap:18px"><div><h3 style="margin-bottom:8px">Apariencia</h3><div class="tema-ops">

const esMovil = () => window.matchMedia("(max-width:768px)").matches;
function miniGuardado(){ try{ const v=localStorage.getItem("rolins.sideMini"); if(v!==null) return v==="1"; }catch(e){} return window.innerWidth<1200; }
function alternarMenu(){
  if(esMovil()){ document.body.classList.toggle("side-open"); return; }
  const mini=!document.body.classList.contains("side-mini"); document.body.classList.toggle("side-mini",mini);
  try{ localStorage.setItem("rolins.sideMini",mini?"1":"0"); }catch(e){}
}
const cerrarMenuMovil = () => document.body.classList.remove("side-open");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") cerrarMenuMovil(); });
function vacioRol(){
  return `<div class="card empty-state" style="margin-top:12px"><h2>Aún no hay roles cargados</h2><p class="hint">${esAdmin()?"Conecta el Google Sheet del mes en “Actualizar rol”.":"Coordinación todavía no publica el rol. Vuelve a revisar más tarde."}</p>${esAdmin()&&puede("cargar")?`<button class="btn primary" data-atab="cargar">Ir a Actualizar rol</button>`:""}</div>`;
}


/* ============ Eventos ============ */
function wire(){
  // Solo lectura: deshabilita los campos de edición de la sección (los botones de acción se ocultan con CSS)
  document.querySelectorAll(".shell-main.ro #fCfg input, .shell-main.ro .tipos input, .shell-main.ro .tipos textarea, .shell-main.ro #fFuente input, .shell-main.ro #fileX, .shell-main.ro #autoSync").forEach(x=>{ x.disabled=true; });
  wireIntercambios();
  wireColores();
  wirePw();
  if(!S.usuario){ wireLogin(); return; }
  document.querySelectorAll("#app [data-drill]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); const f=DR[el.dataset.drill]; if(f) f(); }));
  const sm=$("#selMes"); if(sm) sm.onchange=()=>irAMes(sm.value);
  document.querySelectorAll("[data-messtep]").forEach(b=>b.onclick=()=>{ const L=listaMesesActual(); const i=L.indexOf(S.mes)+Number(b.dataset.messtep); if(L[i]) irAMes(L[i]); });
  wireVac();
  wireDO();
  document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{ if(b.dataset.side==="mini") alternarMenu(); else cerrarMenuMovil(); });
  document.querySelectorAll("[data-sideact]").forEach(b=>b.onclick=()=>{ cerrarMenuMovil(); if(b.dataset.sideact==="salir") confirmarSalir(); else if(b.dataset.sideact==="preferencias") abrirPreferencias(); else abrirCambiarClave(); });
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{ cerrarMenuMovil(); scrollTo(0,0); S.tab=b.dataset.atab; if(S.tab==="cargar"){ S.fuentes=null; S.fuentesMsg=""; } if(S.tab==="colores"){ S.tipos=null; S.colVista=null; S.colImport=null; } if(S.tab==="usuarios") S.adm=null; render(); });
  document.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{ S.modo=b.dataset.modo; render(); });
  document.querySelectorAll("[data-vv]").forEach(b=>b.onclick=()=>{ S.vVuelo=b.dataset.vv; render(); });
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{ S.distModo=b.dataset.dm; render(); });
  document.querySelectorAll("[data-ufm]").forEach(b=>b.onclick=()=>{ S.uFiltroMes=null; render(); });
  document.querySelectorAll("[data-utipo]").forEach(b=>b.onclick=()=>{ S.uTipo=b.dataset.utipo; render(); });
  document.querySelectorAll("[data-ualcv]").forEach(b=>b.onclick=()=>{ S.uAlcV=b.dataset.ualcv; render(); });
  document.querySelectorAll("[data-ualco]").forEach(b=>b.onclick=()=>{ S.uAlcO=b.dataset.ualco; render(); });
  document.querySelectorAll("[data-irmes]").forEach(b=>b.onclick=()=>irAMes(b.dataset.irmes));
  document.querySelectorAll("[data-resolver]").forEach(b=>b.onclick=async()=>{ setCargando(b,true,"…");
    try{ const r=await api("apiResolverObs",S.token,b.dataset.mes,b.dataset.bp,b.dataset.resolver); S.resp[b.dataset.mes+"_"+b.dataset.bp]=r; render(); toast("Observación marcada como resuelta"); }catch(e){ setCargando(b,false); toast(e.message); } });
  document.querySelectorAll("#app [data-verbp]").forEach(b=>b.onclick=()=>verInstructor(b.dataset.verbp));
  document.querySelectorAll("[data-dsel]").forEach(b=>b.onclick=()=>{ S.dia=+b.dataset.dsel; render(); });
  document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{ S.filtro=S.filtro===b.dataset.filtro?null:b.dataset.filtro; render(); });
  const bu=$("#busca"); if(bu) bu.oninput=()=>{ S.busca=bu.value; clearTimeout(S._t); S._t=setTimeout(()=>{ render(); const n=$("#busca"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },220); };
  const buU=$("#buscaU"); if(buU) buU.oninput=()=>{ S.buscaU=buU.value; clearTimeout(S._t); S._t=setTimeout(()=>{ render(); const n=$("#buscaU"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },220); };
  document.querySelectorAll("[data-filu]").forEach(b=>b.onclick=()=>{ S.filtroU=b.dataset.filu; render(); });
  const sv=$("#selVer"); if(sv) sv.onchange=()=>{ S.verBp=sv.value; S.uFiltroMes=null; render(); };
  const sel=document.querySelector(".daybtn[aria-selected='true']"); if(sel) sel.scrollIntoView({block:"nearest",inline:"center"});
  // Actualizar rol
  const ff=$("#fFuente"); if(ff) ff.onsubmit=async e=>{ e.preventDefault(); const url=$("#fuUrl").value.trim(), mes=$("#fuMes").value, hoja=$("#fuHoja").value.trim(), out=$("#fuRes"), b=$("#fuBtn");
    if(!url){ out.innerHTML=`<div class="msg err">Pega el enlace del Google Sheet.</div>`; return; }
    setCargando(b,true,"Leyendo el archivo…"); out.innerHTML="";
    try{ const r=await api("apiAgregarFuente",S.token,url,mes,hoja); S.fuentesMsg=resultadoSync([{...r,ok:true}]); toast(`${mesLargo(r.mes)} conectado: ${r.instructores} instructores`); S.fuentes=null; await recargar(); }
    catch(x){ setCargando(b,false); S.fuentesMsg=`<div class="msg err">${esc(x.message)}</div>`; out.innerHTML=S.fuentesMsg; } };
  document.querySelectorAll("[data-act='sincTodo'],[data-sinc]").forEach(b=>b.onclick=async()=>{ setCargando(b,true,"Sincronizando…");
    try{ const res=await api("apiSincronizar",S.token,b.dataset.sinc||""); S.fuentesMsg=resultadoSync(res); S.fuentes=null; await recargar(); toast(res.every(r=>r.ok)?"Sincronización completa":"Algunos meses no se pudieron leer"); }
    catch(e){ setCargando(b,false); toast(e.message); } });
  document.querySelectorAll("[data-fedit]").forEach(b=>b.onclick=()=>abrirEditarFuente(b.dataset.fedit));
  document.querySelectorAll("[data-pausa]").forEach(b=>b.onclick=async()=>{ setCargando(b,true,"…");
    try{ await api("apiActivarFuente",S.token,b.dataset.pausa,b.dataset.on==="1"); S.fuentes=null; render(); }catch(e){ setCargando(b,false); toast(e.message); } });
  const au=$("#autoSync"); if(au) au.onchange=async()=>{ au.disabled=true;
    try{ const on=await api("apiSincronizacionAutomatica",S.token,au.checked); toast(on?"Listo: los cambios en el Google Sheet se verán en segundos (y cada hora como respaldo)":"Sincronización automática desactivada"); S.fuentes=null; render(); return; }catch(e){ au.checked=!au.checked; toast(e.message); } au.disabled=false; };
  document.querySelectorAll("[data-act='recargarFuentes']").forEach(b=>b.onclick=()=>{ S.fuentes=null; render(); });
  const fx=$("#fileX"), dr=$("#drop");
  if(fx) fx.onchange=()=>{ if(fx.files[0]) leerExcel(fx.files[0]); };
  if(dr){ dr.ondragover=e=>{e.preventDefault();dr.classList.add("over")}; dr.ondragleave=()=>dr.classList.remove("over"); dr.ondrop=e=>{ e.preventDefault(); dr.classList.remove("over"); if(e.dataTransfer.files[0]) leerExcel(e.dataTransfer.files[0]); }; }
  const mx=$("#mesX"); if(mx) mx.onchange=()=>{ if(/^\d{4}-\d{2}$/.test(mx.value)){ const nd=mesInfo(mx.value).dias; S.xlsxPrev.mes=mx.value; S.xlsxPrev.instructores.forEach(i=>{ i.dias=Array.from({length:nd},(_,k)=>i.dias[k]||""); }); render(); } };
  const dx=$("#descX"); if(dx) dx.onclick=()=>{ S.xlsxPrev=null; render(); };
  const px=$("#pubX"); if(px) px.onclick=async()=>{ const pv=S.xlsxPrev; setCargando(px,true,"Publicando…");
    try{ const r=await api("apiPublicarRol",S.token,{mes:pv.mes,instructores:pv.instructores,archivo:pv.archivo,hoja:pv.hoja});
      S.xlsxPrev=null; S.fuentes=null; await recargar(); S.mes=r.mes; S.tab=puede("ind")?"ind":S.tab; render(); toast(`Rol de ${mesLargo(r.mes)} publicado${r.fuentePausada?" (se pausó su Google Sheet)":""}.`); }
    catch(e){ setCargando(px,false); const x=$("#errX"); if(x) x.textContent=e.message; } };
  // Usuarios
  document.querySelectorAll("[data-act='recargarUsuarios']").forEach(b=>b.onclick=()=>{ S.adm=null; render(); });
  document.querySelectorAll("[data-codigo]").forEach(b=>b.onclick=()=>abrirGenerarCodigo(b.dataset.codigo));
  document.querySelectorAll("[data-nuevoadm]").forEach(b=>b.onclick=abrirNuevoAdmin);
  document.querySelectorAll("[data-uedit]").forEach(b=>b.onclick=()=>abrirEditarUsuario(b.dataset.uedit));
  document.querySelectorAll("[data-perfnuevo]").forEach(b=>b.onclick=()=>abrirPerfil(null));
  document.querySelectorAll("[data-perfedit]").forEach(b=>b.onclick=()=>abrirPerfil(b.dataset.perfedit));
  document.querySelectorAll("[data-perfil]").forEach(sel=>sel.onchange=async()=>{ sel.disabled=true;
    try{ await api("apiAsignarPerfil",S.token,sel.dataset.perfil,sel.value); toast("Perfil asignado"); S.adm=null; render(); }
    catch(e){ sel.disabled=false; toast(e.message); S.adm=null; render(); } });
  document.querySelectorAll("[data-syncperf]").forEach(b=>b.onclick=async()=>{ setCargando(b,true,"Consultando directorio…");
    try{ const r=await api("apiSincronizarPerfiles",S.token); toast(`Perfiles actualizados: ${r.actualizados}${r.sinCorreo?` · ${r.sinCorreo} sin correo`:""}${r.noEncontrados.length?` · no encontrados: ${r.noEncontrados.join(", ")}`:""}`); S.adm=null; render(); }
    catch(e){ setCargando(b,false); toast(e.message); } });
  document.querySelectorAll("[data-activ]").forEach(b=>b.onclick=async()=>{ const on=b.dataset.on==="1"; if(!on && !confirm("¿Desactivar su acceso? Se cerrarán sus sesiones abiertas.")) return; setCargando(b,true,"…");
    try{ await api("apiActivarUsuario",S.token,b.dataset.activ,on); toast(on?"Acceso activado":"Acceso desactivado"); S.adm=null; render(); }catch(e){ setCargando(b,false); toast(e.message); } });
  document.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=async()=>{ if(!confirm("¿Cerrar todas las sesiones abiertas de esta persona?")) return; setCargando(b,true,"…");
    try{ await api("apiCerrarSesiones",S.token,b.dataset.cerrar); if(b.dataset.cerrar===S.usuario.bp) return; toast("Sesiones cerradas"); S.adm=null; render(); }catch(e){ setCargando(b,false); toast(e.message); } });
}
/* Menú de cuenta y acciones globales (delegación) */
document.addEventListener("click",e=>{
  const m=$("#menuCuenta"); if(m && m.open && !m.contains(e.target)) m.open=false;
  const a=e.target.closest&&e.target.closest("#who [data-act]"); if(!a) return;
  if(m) m.open=false;
  if(a.dataset.act==="salir") confirmarSalir();
  if(a.dataset.act==="cambiarClave") abrirCambiarClave();
  if(a.dataset.act==="notifs") abrirNotifs();
  if(a.dataset.act==="preferencias") abrirPreferencias();
});
(function(){ const tip=$("#tip");
  document.addEventListener("pointermove",e=>{ if(e.pointerType==="touch") return; const el=e.target.closest&&e.target.closest("[data-tip]"); if(!el||!el.dataset.tip){ tip.hidden=true; return; }
    tip.innerHTML=el.dataset.tip; tip.hidden=false; const r=tip.getBoundingClientRect(); let L=e.clientX+14, T=e.clientY+14; if(L+r.width>innerWidth-8) L=e.clientX-r.width-14; if(T+r.height>innerHeight-8) T=e.clientY-r.height-14; tip.style.left=Math.max(8,L)+"px"; tip.style.top=Math.max(8,T)+"px"; });
  document.addEventListener("scroll",()=>tip.hidden=true,true); })();
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }

window.__archivos=(window.__archivos||{}); window.__archivos["App"]=true;
</script>
