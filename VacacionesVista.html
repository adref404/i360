<script>
/* VacacionesVista — vacaciones por periodo DGAC: cálculo, calendario, solicitud, historial y pestaña de coordinación.
   Los datos vienen del servidor en S.vac (hojas Vacaciones, VacacionesDias, VacacionesBloques y SolicitudesVacaciones). */

/* ============ Cálculo por periodo DGAC (igual que Vacaciones.gs) ============ */
const isoD = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
let VCACHE = {};
function resetVac(){ VCACHE = {}; }
const VAC = () => S.vac || {personas:{}, solicitudes:[], cfg:null, ventanaUltima:null, fuente:""};
function vacPersona(bp){
  if(VCACHE[bp]!==undefined) return VCACHE[bp];
  const v = VAC().personas[bp];
  if(!v){ VCACHE[bp]=null; return null; }
  const base = v.dgac25 || v.dgacOrig || v.dgac26;
  const [, mm, dd] = base.split("-").map(Number);
  const fechas = new Map();
  v.dias.forEach(d=>fechas.set(d,"registro"));
  v.bloques.forEach(b=>{ for(let d=parseISO(b.desde); d<=parseISO(b.hasta); d.setDate(d.getDate()+1)) if(!fechas.has(isoD(d))) fechas.set(isoD(d),"bloque"); });
  /* Noviembre y diciembre 2026: días de la hoja Vacaciones que no tienen fecha exacta */
  const m26=v.mensual2026||{};
  const sinFecha=[]; const sumM=(m26["11"]||0)+(m26["12"]||0);
  let dated=0; for(const k of fechas.keys()) if(k>="2026-11-01"&&k<="2026-12-31") dated++;
  let rest=Math.max(0,sumM-dated);
  ["11","12"].forEach(m=>{ const dm=[...fechas.keys()].filter(k=>k.startsWith("2026-"+m)).length; const n=Math.min(rest,Math.max(0,(m26[m]||0)-dm)); if(n>0){ sinFecha.push({mes:"2026-"+m,n}); rest-=n; } });
  const r = {...v, bp, mm, dd, fechas, sinFecha, fechaBase: base, sinDgacPropia: !v.dgac25};
  VCACHE[bp]=r; return r;
}
const inicioPer = (vp,Y) => new Date(Y, vp.mm-1, vp.dd);
const finPer = (vp,Y) => new Date(Y+1, vp.mm-1, vp.dd-1);
function derechoPer(vp,Y){
  if(Y===2025) return vp.meta2526;
  if(Y===2026) return vp.meta2627;
  if(Y<2025) return Math.max(30, vp.meta2526-(2025-Y));
  return Math.min(45, vp.meta2627+(Y-2026));
}
const anioVig = (vp,hoy) => hoy>=inicioPer(vp,hoy.getFullYear()) ? hoy.getFullYear() : hoy.getFullYear()-1;
const anioDeFecha = (vp,f) => f>=inicioPer(vp,f.getFullYear()) ? f.getFullYear() : f.getFullYear()-1;
const etiquetaPer = Y => `${Y}-${String((Y+1)%100).padStart(2,"0")}`;
/* extra = {aprob:Set iso, pend:Set iso} */
function periodoVac(vp, Y, hoy, extra){
  extra = extra || {aprob:new Set(), pend:new Set()};
  const ini=inicioPer(vp,Y), fin=finPer(vp,Y), a=isoD(ini), b=isoD(fin), h=isoD(hoy);
  let tom=0, prog=0, sol=0; const dTom=[], dProg=[], dSol=[];
  for(const k of vp.fechas.keys()) if(k>=a && k<=b){ if(k<=h){ tom++; dTom.push(k); } else { prog++; dProg.push(k); } }
  extra.aprob.forEach(k=>{ if(k>=a && k<=b && !vp.fechas.has(k)){ prog++; dProg.push(k); } });
  extra.pend.forEach(k=>{ if(k>=a && k<=b && !vp.fechas.has(k)){ sol++; dSol.push(k); } });
  let sinF=0; vp.sinFecha.forEach(s=>{ const mid=s.mes+"-15"; if(mid>=a && mid<=b){ prog+=s.n; sinF+=s.n; } });
  const der=derechoPer(vp,Y);
  const total=(fin-ini)/864e5+1, trans=Math.max(0,Math.min(total,(hoy-ini)/864e5+1));
  return {Y, etiqueta:etiquetaPer(Y), ini, fin, der, tom, prog, sol, sinF, pend:der-tom-prog, estimado:(Y<2025||Y>2026),
    dTom:dTom.sort(), dProg:dProg.sort(), dSol:dSol.sort(), avance: trans/total, diasRenov: Math.ceil((fin-hoy)/864e5)+1};
}
function rangosISO(list){
  const out=[]; let cur=null;
  list.slice().sort().forEach(k=>{ const f=parseISO(k); if(cur && Math.round((f-cur.hasta)/864e5)===1){ cur.hasta=f; cur.n++; } else { cur={desde:f,hasta:f,n:1}; out.push(cur); } });
  return out;
}

/* ============ Estado de la ventana y de las solicitudes ============ */
const CFG_DEF = {habilitado:false, desde:"", hasta:"", mesDesde:"2027-01", mesHasta:"2027-12"};
function cfgVac(){ return {...CFG_DEF, ...(VAC().cfg||{})}; }
function ventanaAbierta(){ const c=cfgVac(), h=isoD(HOY); return !!c.habilitado && (!c.desde||h>=c.desde) && (!c.hasta||h<=c.hasta); }
function esPropio(bp, desdeAdmin){ return !desdeAdmin && S.usuario && S.usuario.rol==="inst" && S.usuario.bp===bp; }
function puedeSeleccionar(bp, mes, desdeAdmin){ const c=cfgVac(); return esPropio(bp,desdeAdmin) && ventanaAbierta() && mes>=c.mesDesde && mes<=c.mesHasta && mes>=mesHoy(); }
function solicitudesDe(bp){ return (VAC().solicitudes||[]).filter(s=>s.bp===bp).sort((a,b)=>String(b.at).localeCompare(String(a.at))); }
function extraDe(bp){ const aprob=new Set(), pend=new Set(); solicitudesDe(bp).forEach(s=>{ (s.dias||[]).forEach(k=>{ if(s.estado==="aprobada") aprob.add(k); else if(s.estado==="pendiente") pend.add(k); }); }); return {aprob,pend}; }
function estadoVac(vp,k,ex){ if(vp&&vp.fechas.has(k)) return k<=isoD(HOY)?"tom":"prog"; if(ex.aprob.has(k)) return k<=isoD(HOY)?"tom":"prog"; if(ex.pend.has(k)) return "sol"; return null; }
/* Meses que puede recorrer un instructor: desde 2024 hasta diciembre del próximo año, más los meses con rol */
function mesesUsuario(){ const out=new Set(MO.orden); const yMax=HOY.getFullYear()+1; for(let y=2024;y<=yMax;y++) for(let m=1;m<=12;m++) out.add(y+"-"+String(m).padStart(2,"0")); return [...out].sort(); }
const fmtC = f => f.toLocaleDateString("es-PE",{day:"numeric",month:"short"});
const fmtL = f => f.toLocaleDateString("es-PE",{day:"numeric",month:"short",year:"numeric"});
const plural = (n,s,p) => `${n} ${Math.abs(n)===1?s:(p||s+"s")}`;
const ESTADO_SOL = {pendiente:["warn","Por aprobar"], aprobada:["good","Aprobada"], rechazada:["crit","Rechazada"], cancelada:["","Cancelada"]};
const pillSol = s => { const e=ESTADO_SOL[s.estado]||["",cap(s.estado||"")]; return `<span class="pill ${e[0]}"><i></i>${e[1]}</span>`; };
const rangoTxt = dias => rangosISO(dias||[]).map(x=>`${fmtC(x.desde)}${x.n>1?"–"+fmtC(x.hasta):""}`).join(" · ");

/* Barra de uso del periodo: tomados | programados | solicitados | libres */
function vbar(p, alto){
  const tot=Math.max(p.der, p.tom+p.prog+p.sol);
  const seg=(n,cls,tip)=> n>0?`<span class="${cls}" style="flex:${n}" data-tip="${esc(tip)}"></span>`:"";
  const libres=Math.max(0,p.der-p.tom-p.prog-p.sol);
  const exceso=Math.max(0,p.tom+p.prog+p.sol-p.der);
  return `<div class="vbar ${alto?"lg":""}" role="img" aria-label="${p.tom} tomados, ${p.prog} programados, ${libres} por programar de ${p.der}">
    ${seg(p.tom,"vt",`<b>Tomados</b>: ${p.tom} días`)}${seg(p.prog,"vp",`<b>Programados</b>: ${p.prog} días`)}${seg(p.sol,"vs",`<b>Solicitados</b>: ${p.sol} días`)}${seg(libres,"vl",`<b>Por programar</b>: ${libres} días`)}
    ${exceso?`<i class="vmark" style="left:${p.der/tot*100}%" data-tip="${esc(`Derecho del periodo: ${p.der} días`)}"></i>`:""}</div>`;
}

/* ============ Resumen del periodo vigente (sobre el calendario) ============ */
function vacResumenHTML(bp, desdeAdmin){
  const vp=vacPersona(bp);
  if(!vp) return `<div class="card vsum"><div class="row" style="gap:10px"><span class="pill">Vacaciones</span><span class="hint">No hay información de vacaciones para este BP en la hoja Vacaciones.</span></div></div>`;
  const ex=extraDe(bp); const Y=anioVig(vp,HOY); const p=periodoVac(vp,Y,HOY,ex); const nx=periodoVac(vp,Y+1,HOY,ex);
  const porTomar=p.der-p.tom, libres=p.der-p.tom-p.prog-p.sol;
  const c=cfgVac(); const ab=ventanaAbierta(); const propio=esPropio(bp,desdeAdmin); const vu=VAC().ventanaUltima;
  const ventana = ab
    ? `<div class="vwin open"><span class="pill good"><i></i>Solicitud habilitada</span><p>${c.hasta?`Hasta el ${fmtL(parseISO(c.hasta))}`:"Abierta"} · días de ${mesLargo(c.mesDesde)} a ${mesLargo(c.mesHasta)}</p>${propio?`<button class="btn primary sm" data-irsol="1">Elegir mis días</button>`:""}</div>`
    : `<div class="vwin"><span class="pill"><i></i>Solicitud no habilitada</span><p>${propio?"Puedes revisar los meses futuros. Coordinación avisará cuando abra la próxima ventana":"La ventana de solicitud está cerrada"}${vu?` (la última fue del ${fmtC(parseISO(vu.desde))} al ${fmtC(parseISO(vu.hasta))})`:""}.</p></div>`;
  return `<div class="card vsum">
    <div class="vsum-top">
      <div class="vsum-per"><span class="eyebrow">${propio?"Tus vacaciones":"Vacaciones"} · periodo vigente</span>
        <div class="row" style="gap:10px;align-items:baseline"><h2>Periodo ${p.etiqueta}</h2><span class="hint">${fmtL(p.ini)} → ${fmtL(p.fin)}</span></div>
        <div class="vtime" aria-label="Avance del periodo"><span style="width:${p.avance*100}%"></span><i style="left:${p.avance*100}%"></i></div>
        <div class="row between hint" style="margin-top:4px"><span>Inicio</span><span><b style="color:var(--ink)">Se renueva el ${fmtC(new Date(p.fin.getTime()+864e5))}</b> · en ${plural(p.diasRenov,"día")}</span></div>
      </div>
      ${ventana}
    </div>
    <div class="vstats">
      <div class="vst"><span class="l">Días disponibles</span><b class="num">${p.der}</b><span class="s">Derecho del periodo</span></div>
      <div class="vst"><span class="l"><i class="sw" style="background:var(--c-vac)"></i>Días tomados</span><b class="num">${p.tom}</b><span class="s">${pct(p.der?p.tom/p.der:0)} del periodo</span></div>
      <div class="vst"><span class="l"><i class="sw vp-sw"></i>Programados</span><b class="num">${p.prog+p.sol}</b><span class="s">${p.sol?`${p.sol} solicitados por aprobar`:p.sinF?`${p.sinF} sin fecha exacta`:"aún por tomar"}</span></div>
      <div class="vst ${libres<0?"neg":""}"><span class="l">Días pendientes</span><b class="num">${libres<0?0:libres}</b><span class="s">${libres<0?`Excede en ${-libres} días el derecho`:`por programar · ${porTomar} por tomar`}</span></div>
    </div>
    ${vbar({...p},true)}
    <div class="row between hint" style="margin-top:6px"><span>0</span><span>Siguiente periodo ${nx.etiqueta}: <b style="color:var(--ink)">${nx.der} días</b>${nx.der>p.der?` (+${nx.der-p.der})`:nx.der>=45?" (tope de 45)":""}${nx.prog+nx.sol?` · ${nx.prog+nx.sol} ya programados`:""}</span><span>${p.der}</span></div>
  </div>`;
}

/* ============ Calendario del mes con capa de vacaciones y selección ============ */
function calHTML(bp, mes, desdeAdmin){
  const pe=MO.personas[bp]; const p=pe&&pe.meses[mes]; const mi=mesInfo(mes);
  const vp=vacPersona(bp); const ex=extraDe(bp);
  const sel=puedeSeleccionar(bp,mes,desdeAdmin) && !p;
  const r=respDe(bp,mes); const obsDias=new Set((r&&r.obs||[]).filter(o=>o.estado!=="resuelta").map(o=>o.dia));
  const tiles=[]; const off=(dowOf(mes,1)+6)%7; for(let k=0;k<off;k++) tiles.push("<div></div>");
  const h=isoD(HOY); const strip=[];
  for(let d=1; d<=mi.dias; d++){
    const k=isoD(new Date(mi.y,mi.m-1,d)); const hoyC=k===h?"today":"";
    if(p){ const x=p[d-1]; strip.push(x.k);
      tiles.push(`<button class="tile k-${x.k} ${hoyC} ${obsDias.has(d)?"has-obs":""}" ${drill(()=>abrirDia(bp,mes,d))} aria-label="${d}: ${esc(x.titulo)}"><span class="d num">${d}</span><span class="c"><span>${esc(x.code)}</span><small>${["SIN","DO","VAC","FER"].includes(x.k)?"":esc(x.k==="VIN"?"INS":x.k)}</small></span>${x.pernocta?`<i class="v"></i>`:""}</button>`);
    } else {
      const st=estadoVac(vp,k,ex); const isSel=S.selVac.has(k);
      let cls="k-NO", code="", sm="";
      if(isSel){ cls="k-SEL"; code="✓"; sm="Pedir"; }
      else if(st==="tom"){ cls="k-VAC"; code="Vac."; sm="Tomada"; }
      else if(st==="prog"){ cls="k-VACP"; code="Vac."; sm="Prog."; }
      else if(st==="sol"){ cls="k-SOL"; code="Solic."; }
      strip.push(isSel?"SEL":st==="tom"?"VAC":st==="prog"?"VACP":st==="sol"?"SOL":"NO");
      const pick = sel && k>h && (!st || isSel);
      const w=dowOf(mes,d); const fds=(w===0||w===6)?"fds":"";
      tiles.push(`<button class="tile ${cls} ${fds} ${hoyC} ${pick?"pick":""}" ${pick?`data-pick="${k}"`:"tabindex=\"-1\""} aria-label="${d}${st?": vacaciones "+(st==="tom"?"tomadas":st==="prog"?"programadas":"solicitadas"):""}${isSel?": seleccionado":""}"><span class="d num">${d}</span><span class="c"><span>${code}</span><small>${sm}</small></span></button>`);
    }
  }
  const sinF = vp ? vp.sinFecha.filter(s=>s.mes===mes) : [];
  return {tiles:tiles.join(""), strip, sel, sinF, conRol:!!p};
}

/* ============ Panel de selección y validación ============ */
function selPanelHTML(bp){
  const vp=vacPersona(bp); if(!vp) return "";
  const ex=extraDe(bp); const sel=[...S.selVac].sort();
  const c=cfgVac();
  if(!sel.length) return `<div class="selpanel empty"><b>Toca los días que quieres pedir</b><span class="hint">Puedes elegir días libres entre ${mesLargo(c.mesDesde)} y ${mesLargo(c.mesHasta)}. Usa las flechas del mes para avanzar.</span></div>`;
  const porY={}; sel.forEach(k=>{ const Y=anioDeFecha(vp,parseISO(k)); (porY[Y]=porY[Y]||[]).push(k); });
  let ok=true;
  const filas=Object.keys(porY).map(Number).sort().map(Y=>{ const p=periodoVac(vp,Y,HOY,ex); const disp=p.der-p.tom-p.prog-p.sol; const n=porY[Y].length; const q=disp-n; if(q<0) ok=false;
    return `<div class="selrow"><div class="row between"><span><b>Periodo ${p.etiqueta}</b> <span class="hint">· máximo ${p.der} días</span></span><span class="num ${q<0?"neg":""}">${disp} disponibles → <b>${q<0?`excede en ${-q}`:`quedan ${q}`}</b></span></div>
      <div class="vbar"><span class="vt" style="flex:${p.tom}"></span><span class="vp" style="flex:${p.prog+p.sol}"></span><span class="vn ${q<0?"bad":""}" style="flex:${n}"></span><span class="vl" style="flex:${Math.max(0,q)}"></span></div></div>`; }).join("");
  return `<div class="selpanel ${ok?"":"err"}"><div class="row between"><div><span class="eyebrow">Tu solicitud</span><div class="selnum"><b class="num">${sel.length}</b> ${sel.length===1?"día":"días"}</div><span class="hint">${esc(rangoTxt(sel))}</span></div>
    <div class="row"><button class="btn sm" data-selclear="1">Limpiar</button><button class="btn primary" data-selsend="1" ${ok?"":"disabled"}>Enviar solicitud</button></div></div>
    ${filas}${ok?"":`<p class="err" style="margin:0">Estás pidiendo más días de los que te quedan en ese periodo. Quita días para poder enviar.</p>`}</div>`;
}
function solicitudCardHTML(bp, mes, desdeAdmin, selActiva){
  const vp=vacPersona(bp); if(!vp) return "";
  const c=cfgVac(), ab=ventanaAbierta(), propio=esPropio(bp,desdeAdmin);
  const l=solicitudesDe(bp);
  const lista=l.length?`<div class="fl">${l.map(s=>`<div class="fl-i" style="grid-template-columns:1fr auto;cursor:default"><span><span class="t">${plural(s.n||(s.dias||[]).length,"día")}</span><br><span class="m">${esc(rangoTxt(s.dias))}</span>${s.decididoPor&&s.estado!=="pendiente"?`<br><span class="m">${esc(ESTADO_SOL[s.estado]?ESTADO_SOL[s.estado][1]:s.estado)} por ${esc(s.decididoPor)} · ${fechaCorta(s.decididoAt)}</span>`:""}</span><span class="row" style="gap:6px">${pillSol(s)}${propio&&s.estado==="pendiente"?`<button class="btn sm" data-cancelsol="${esc(s.id)}">Cancelar</button>`:""}</span></div>`).join("")}</div>`:"";
  let cuerpo;
  if(!ab) cuerpo=`<p class="hint">La solicitud no está habilitada.${propio?" Puedes avanzar a los meses siguientes para revisar tus vacaciones, pero aún no puedes elegir días.":""}</p>`;
  else if(!propio) cuerpo=`<p class="hint">Ventana abierta hasta ${c.hasta?fmtL(parseISO(c.hasta)):"nuevo aviso"} para días de ${mesLargo(c.mesDesde)} a ${mesLargo(c.mesHasta)}.</p>`;
  else if(selActiva) cuerpo=selPanelHTML(bp);
  else cuerpo=`<p class="hint">Ventana abierta${c.hasta?` hasta el ${fmtL(parseISO(c.hasta))}`:""}. Ve a un mes entre ${mesLargo(c.mesDesde)} y ${mesLargo(c.mesHasta)} sin rol publicado y toca los días en el calendario.</p><div><button class="btn primary sm" data-irsol="1">Ir a ${mesLargo(c.mesDesde>mesHoy()?c.mesDesde:mesHoy())}</button></div>${S.selVac.size?`<p class="hint">Tienes ${plural(S.selVac.size,"día")} elegidos sin enviar.</p>`:""}`;
  return `<div class="card stack" style="gap:10px;${ab?"border-color:color-mix(in srgb,var(--good) 45%,var(--line))":""}"><div class="row between"><h3>Solicitar vacaciones</h3><span class="pill ${ab?"good":""}"><i></i>${ab?"Habilitada":"No habilitada"}</span></div>
    ${cuerpo}${lista?`<div><span class="eyebrow">${propio?"Tus solicitudes":"Sus solicitudes"}</span>${lista}</div>`:""}</div>`;
}

/* ============ Historial desde 2024 ============ */
function vacHistHTML(bp){
  const vp=vacPersona(bp); if(!vp) return "";
  const ex=extraDe(bp); const Yv=anioVig(vp,HOY);
  const ys=[]; for(let Y=2024; Y<=Yv; Y++) ys.push(Y);
  const rows=ys.slice().reverse().map(Y=>{ const p=periodoVac(vp,Y,HOY,ex); const usados=p.tom+p.prog;
    const rgs=rangosISO(p.dTom.concat(p.dProg).filter(k=>k>="2024-01-01"));
    return `<details class="vh" ${Y===Yv?"open":""}><summary><span class="vh-l"><b>${p.etiqueta}</b>${Y===Yv?` <span class="pill acc" style="padding:0 7px;font-size:10.5px">Vigente</span>`:""}<small>${fmtC(p.ini)} ${p.ini.getFullYear()} → ${fmtC(p.fin)} ${p.fin.getFullYear()}</small></span>
      <span class="vh-b">${vbar(p,false)}</span><span class="vh-n num">${usados}<small>/${p.der}${p.estimado?"*":""}</small></span></summary>
      <div class="fl">${rgs.length?rgs.map(x=>`<div class="fl-i" style="grid-template-columns:1fr auto;cursor:default"><span class="t">${fmtC(x.desde)}${x.n>1?` al ${fmtC(x.hasta)}`:""} ${x.desde.getFullYear()}</span><span class="row" style="gap:6px"><b class="num">${plural(x.n,"día")}</b><span class="pill ${x.desde>HOY?"info":"good"}">${x.desde>HOY?"Programadas":"Tomadas"}</span></span></div>`).join(""):`<p class="empty">Sin vacaciones registradas en este periodo.</p>`}
      ${p.sinF?`<p class="hint" style="padding-top:6px">${p.sinF} días programados en ${vp.sinFecha.map(s=>mesInfo(s.mes).nombre).join(" y ")} sin fecha exacta en la hoja.</p>`:""}</div></details>`; }).join("");
  return `<div class="card"><div class="chart-title"><div><h3>Historial de vacaciones</h3><p>Por periodo DGAC, desde 2024. Toca un periodo para ver las fechas.</p></div>
    <div class="legend"><span><i class="sw" style="background:var(--c-vac)"></i>Tomadas</span><span><i class="sw vp-sw"></i>Programadas</span><span><i class="sw" style="box-shadow:inset 0 0 0 1px var(--line-2)"></i>Por programar</span></div></div>${rows}
    ${ys.some(Y=>Y<2025)?`<p class="hint" style="margin-top:8px">* Derecho estimado con la regla de +1 día por renovación; la hoja solo trae el derecho de 2025-26 y 2026-27.</p>`:""}</div>`;
}

/* ============ Equipo: saldo del periodo vigente ============ */
const mesUltimo = () => MO.orden[MO.orden.length-1];
function vacEquipo(){
  const ref=mesUltimo();
  return Object.values(MO.personas).filter(pe=>!ref||pe.meses[ref]).map(pe=>{ const vp=vacPersona(pe.bp); if(!vp) return {pe,vp:null}; const p=periodoVac(vp,anioVig(vp,HOY),HOY,extraDe(pe.bp)); return {pe,vp,p}; });
}
function vacEquipoHTML(titulo){
  const rows=vacEquipo();
  const con=rows.filter(r=>r.vp).sort((a,b)=>a.p.diasRenov-b.p.diasRenov);
  const sin=rows.filter(r=>!r.vp);
  const estado=r=>{ const lib=r.p.der-r.p.tom-r.p.prog-r.p.sol; if(lib<0) return {c:"crit",t:`Excede ${-lib}`}; if(lib>0&&r.p.diasRenov<=90) return {c:"warn",t:`${lib} por vencer`}; if(lib>0) return {c:"",t:`${lib} por programar`}; return {c:"good",t:"Completo"}; };
  return `<div class="card" id="vacChart"><div class="chart-title"><div><h3>${titulo||"Vacaciones del periodo vigente"}</h3><p>Cada instructor tiene su propio periodo según su fecha DGAC. Ordenado por quién renueva primero.${puede("inst")?" Toca un nombre para ver su detalle.":""}</p></div>
    <div class="legend"><span><i class="sw" style="background:var(--c-vac)"></i>Tomadas</span><span><i class="sw vp-sw"></i>Programadas</span><span><i class="sw vs-sw"></i>Solicitadas</span><span><i class="sw" style="box-shadow:inset 0 0 0 1px var(--line-2)"></i>Por programar</span></div></div>
    <div class="veq">${con.map(r=>{ const e=estado(r); return `<button class="veq-r" ${drill(()=>{ if(!puede("inst")) return; S.verBp=r.pe.bp; S.tab="inst"; S.mes=mesHoy(); render(); scrollTo(0,0); })}>
      <span class="veq-n"><b>${esc(r.pe.nombre)}</b><small>${r.p.etiqueta} · renueva ${fmtC(new Date(r.p.fin.getTime()+864e5))} (${r.p.diasRenov} d)</small></span>
      <span class="veq-b">${vbar(r.p,false)}</span><span class="veq-v num">${r.p.tom+r.p.prog}<small>/${r.p.der}</small></span><span class="pill ${e.c}" style="justify-self:end">${e.t}</span></button>`; }).join("")||`<p class="empty">Sin datos de vacaciones.</p>`}</div>
    ${sin.length?`<p class="hint" style="margin-top:8px">Sin datos en la hoja Vacaciones: ${sin.map(r=>esc(r.pe.nombre)).join(", ")}.</p>`:""}</div>`;
}

/* ============ Pestaña Vacaciones (coordinación) ============ */
function admVac(){
  const c=cfgVac(); const ab=ventanaAbierta(); const vu=VAC().ventanaUltima;
  const sols=(VAC().solicitudes||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const pend=sols.filter(s=>s.estado==="pendiente"), dec=sols.filter(s=>s.estado!=="pendiente").slice(0,12);
  const solRow=(s,acc)=>{ const pe=MO.personas[s.bp]; const vp=vacPersona(s.bp);
    let val=""; if(vp){ const ex=extraDe(s.bp); const porY={}; (s.dias||[]).forEach(k=>{ const Y=anioDeFecha(vp,parseISO(k)); porY[Y]=(porY[Y]||0)+1; });
      val=Object.keys(porY).map(Number).map(Y=>{ const p=periodoVac(vp,Y,HOY,ex); const disp=p.der-p.tom-p.prog-(s.estado==="pendiente"?p.sol-porY[Y]:p.sol); return `Periodo ${p.etiqueta}: ${porY[Y]} de ${disp} disponibles`; }).join(" · "); }
    return `<div class="obs-item"><div class="h"><b>${esc(pe?pe.nombre:(s.nombre||s.bp))}</b>${pillSol(s)}</div>
      <p><b class="num">${plural(s.n||(s.dias||[]).length,"día")}</b> · ${esc(rangoTxt(s.dias))}</p><span class="hint">${esc(val)}${val?" · ":""}enviada ${fechaCorta(s.at)}${s.decididoPor&&!acc?` · ${esc(ESTADO_SOL[s.estado]?ESTADO_SOL[s.estado][1].toLowerCase():s.estado)} por ${esc(s.decididoPor)}`:""}</span>
      ${acc?`<div class="row"><button class="btn sm primary" data-aprobar="${esc(s.id)}">Aprobar</button><button class="btn sm" data-rechazar="${esc(s.id)}">Rechazar</button></div>`:""}</div>`; };
  return `<div class="stack">
    <div class="grid2e">
      <div class="card stack" style="gap:12px">
        <div class="row between"><h3>Ventana de solicitud de vacaciones</h3><span class="pill ${ab?"good":""}"><i></i>${ab?"Habilitada":"No habilitada"}</span></div>
        <p class="hint">Mientras esté habilitada, cada instructor puede elegir días en su calendario (en meses sin rol publicado) y enviarlos. El servidor valida que no pida más días de los que le quedan en su periodo. Fuera de la ventana solo pueden ver los meses futuros.</p>
        <form id="fCfg" class="stack" style="gap:10px" novalidate>
          <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="cfgOn" ${c.habilitado?"checked":""}> Habilitar solicitudes</label>
          <div class="grid2e" style="gap:10px"><div class="field"><label for="cfgDesde">Abierta desde</label><input class="input" type="date" id="cfgDesde" value="${esc(c.desde)}"></div><div class="field"><label for="cfgHasta">Abierta hasta</label><input class="input" type="date" id="cfgHasta" value="${esc(c.hasta)}"></div></div>
          <div class="grid2e" style="gap:10px"><div class="field"><label for="cfgMD">Se pueden pedir días desde</label><input class="input" type="month" id="cfgMD" value="${esc(c.mesDesde)}"></div><div class="field"><label for="cfgMH">Hasta</label><input class="input" type="month" id="cfgMH" value="${esc(c.mesHasta)}"></div></div>
          <p class="err" id="cfgErr"></p>
          <div><button class="btn primary" type="submit" id="cfgBtn">Guardar</button></div>
        </form>
        ${vu?`<p class="hint">Última ventana registrada en el archivo de vacaciones: del ${fmtL(parseISO(vu.desde))} al ${fmtL(parseISO(vu.hasta))}.</p>`:""}
      </div>
      <div class="card"><div class="row between" style="margin-bottom:8px"><h3>Solicitudes por revisar</h3><span class="pill ${pend.length?"warn":""}">${pend.length}</span></div>
        ${pend.length?`<div class="obs">${pend.map(s=>solRow(s,true)).join("")}</div>`:`<p class="empty">No hay solicitudes pendientes.</p>`}
        ${dec.length?`<h3 style="margin:14px 0 8px">Últimas decididas</h3><div class="obs">${dec.map(s=>solRow(s,false)).join("")}</div>`:""}</div>
    </div>
    ${vacEquipoHTML()}
    <p class="foot">Fuente: ${esc(VAC().fuente||"hoja Vacaciones")} (hojas Vacaciones, VacacionesDias y VacacionesBloques del Google Sheet base). El derecho de 2025-26 y 2026-27 viene de la hoja; los siguientes suman 1 día por renovación hasta 45. Las solicitudes aprobadas cuentan como programadas.</p>
  </div>`;
}

/* ============ Acciones ============ */
async function enviarSolicitud(bp, btn){
  const dias=[...S.selVac].sort(); if(!dias.length) return;
  setCargando(btn,true,"Enviando…");
  try{ const r=await api("apiEnviarSolicitudVac",S.token,dias,dispositivo()); S.vac.solicitudes=r.solicitudes; resetVac(); S.selVac.clear(); toast(`Solicitud de ${plural(dias.length,"día")} enviada a coordinación`); render(); }
  catch(e){ setCargando(btn,false); toast(e.message); }
}
async function cancelarSolicitud(id, btn){
  if(!confirm("¿Cancelar esta solicitud de vacaciones?")) return;
  setCargando(btn,true,"…");
  try{ const r=await api("apiCancelarSolicitudVac",S.token,id); S.vac.solicitudes=r.solicitudes; resetVac(); toast("Solicitud cancelada"); render(); }
  catch(e){ setCargando(btn,false); toast(e.message); }
}
async function decidirSolicitud(id, estado, btn){
  setCargando(btn,true,"…");
  try{ const r=await api("apiDecidirSolicitudVac",S.token,id,estado); S.vac.solicitudes=r.solicitudes; resetVac(); toast(estado==="aprobada"?"Solicitud aprobada":"Solicitud rechazada"); render(); }
  catch(e){ setCargando(btn,false); toast(e.message); }
}
async function guardarCfg(c, btn){
  setCargando(btn,true,"Guardando…");
  try{ const r=await api("apiGuardarCfgVac",S.token,c); S.vac.cfg=r; toast(r.habilitado?"Ventana de solicitudes guardada":"Ventana de solicitudes cerrada"); render(); }
  catch(e){ setCargando(btn,false); const x=$("#cfgErr"); if(x) x.textContent=e.message; }
}
function wireVac(){
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const k=b.dataset.pick; if(S.selVac.has(k)) S.selVac.delete(k); else S.selVac.add(k); render(); });
  document.querySelectorAll("[data-selclear]").forEach(b=>b.onclick=()=>{ S.selVac.clear(); render(); });
  document.querySelectorAll("[data-selsend]").forEach(b=>b.onclick=()=>enviarSolicitud(S.usuario.bp,b));
  document.querySelectorAll("[data-cancelsol]").forEach(b=>b.onclick=()=>cancelarSolicitud(b.dataset.cancelsol,b));
  document.querySelectorAll("[data-irsol]").forEach(b=>b.onclick=()=>{ const c=cfgVac(); const m=c.mesDesde>mesHoy()?c.mesDesde:mesHoy(); S.mes=m; S.uFiltroMes=null; render(); const el=document.getElementById("calRol"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); });
  document.querySelectorAll("[data-aprobar]").forEach(b=>b.onclick=()=>decidirSolicitud(b.dataset.aprobar,"aprobada",b));
  document.querySelectorAll("[data-rechazar]").forEach(b=>b.onclick=()=>decidirSolicitud(b.dataset.rechazar,"rechazada",b));
  const fc=$("#fCfg"); if(fc) fc.onsubmit=e=>{ e.preventDefault(); guardarCfg({habilitado:$("#cfgOn").checked, desde:$("#cfgDesde").value, hasta:$("#cfgHasta").value, mesDesde:$("#cfgMD").value||CFG_DEF.mesDesde, mesHasta:$("#cfgMH").value||CFG_DEF.mesHasta}, $("#cfgBtn")); };
}

window.__archivos=(window.__archivos||{}); window.__archivos["VacacionesVista"]="v2.4";
</script>
